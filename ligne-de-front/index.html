<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ligne de Front</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Style "carte de campagne" : herbe vive, gros contours encre, camps bleu (vous) et rouge (ennemi), panneaux crème. */
:root {
  --ink: #1b2540;
  --cream: #fff6dc;
  --cream-2: #f3e4b8;
  --grass: #8ed05a;
  --grass-2: #80c24c;
  --grass-d: #5fa83a;
  --dirt: #d9b072;
  --dirt-2: #c99a58;
  --blue: #3d86e8;
  --blue-d: #2559b5;
  --red: #e5543f;
  --red-d: #b3351f;
  --yellow: #ffd24a;
  --yellow-d: #d79d1c;
  --green: #52b34f;
  --sky: #7cc7f4;
  --sky-2: #cdeefc;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--grass);
  background-image: conic-gradient(var(--grass-2) 25%, transparent 0 50%, var(--grass-2) 0 75%, transparent 0);
  background-size: 56px 56px;
  color: var(--ink); font-family: var(--font-body); font-weight: 700; font-size: 16px; line-height: 1.35;
  padding-inline: 14px; padding-block: 12px 40px; min-height: 100%;
}
#app { max-width: 720px; margin-inline: auto; }
h1, h2, h3, p { margin: 0; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: .02em; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--blue-d); outline-offset: 2px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: #5a6585; }
.small { font-size: .88rem; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.hd { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.panel { background: var(--cream); border: 3px solid var(--ink); border-radius: 14px; padding: 12px; box-shadow: 0 4px 0 var(--ink); }
.ribbon { display: inline-block; background: var(--blue); color: #fff; font-family: var(--font-display); font-weight: 700; letter-spacing: .04em; padding: 5px 16px; border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink); text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
.ribbon.red { background: var(--red); }
.spr { display: block; overflow: visible; }

.btn {
  border: 3px solid var(--ink); border-radius: 12px; padding: 12px 20px; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: .04em; text-transform: uppercase;
  background: var(--yellow); color: var(--ink); box-shadow: 0 5px 0 var(--ink); transition: transform .08s, box-shadow .08s, filter .15s;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.btn.go { background: var(--green); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
.btn.ghost { background: var(--cream); }
.btn:disabled { filter: grayscale(.8); opacity: .6; cursor: not-allowed; }
.pill { border: 3px solid var(--ink); background: var(--cream); border-radius: 99px; padding: 3px 13px; font-size: .92rem; box-shadow: 0 3px 0 var(--ink); }
.pill:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

/* Titre */
.title { margin-inline: -14px; margin-top: -48px; display: grid; gap: 14px; justify-items: center; align-content: start; text-align: center; padding: calc(7vh + 40px) 18px 6vh; min-height: calc(100vh - 12px);
  background: linear-gradient(180deg, var(--sky) 0, var(--sky-2) 280px, var(--grass) 280.5px); }
.title h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.6rem, 13vw, 4.8rem); line-height: .92; color: var(--yellow); text-transform: uppercase; text-wrap: balance;
  text-shadow: 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 6px 0 var(--ink); }
.title .tag { font-size: 1.05rem; color: var(--ink); background: var(--cream); border: 3px solid var(--ink); border-radius: 10px; padding: 6px 12px; max-width: 34ch; }
.armies { display: flex; justify-content: center; align-items: flex-end; margin-block: 2vh 0; gap: 0; }
.armies .spr { margin-inline: -6px; }
.record { font-family: var(--font-display); font-size: .95rem; color: var(--ink); background: rgba(255, 246, 220, .85); border-radius: 8px; padding: 2px 10px; }

/* Carte de campagne */
.fronts { display: grid; gap: 7px; }
.front { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; border: 3px solid var(--ink); background: var(--cream); box-shadow: 0 3px 0 var(--ink); }
.front.cur { background: var(--yellow); }
.front.done { background: var(--cream-2); opacity: .8; }
.front .nm { display: flex; gap: 8px; align-items: center; font-weight: 800; }
.front .tag { font-size: .85rem; color: #5a6585; }
.front.cur .tag { color: var(--ink); }
.bossmark { font-family: var(--font-display); background: var(--red); color: #fff; border-radius: 6px; padding: 0 6px; font-size: .8rem; border: 2px solid var(--ink); }

.hqbar { display: grid; gap: 4px; }
.hqbar .lbl { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-display); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: .95rem; }
.hqbar .lbl span:first-child { display: flex; align-items: center; gap: 6px; }
.bar { height: 14px; border-radius: 8px; background: #fff; border: 3px solid var(--ink); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green); transition: width .3s; }
.hq.en .bar > i { background: var(--red); }
.hq.me .bar > i { background: var(--blue); }
.hq.hit { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* Champ de bataille */
.board { display: grid; gap: 8px; }
.hq { padding: 8px 10px; border-radius: 12px; border: 3px solid var(--ink); background: var(--cream); box-shadow: 0 3px 0 var(--ink); position: relative; }
.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.lane { position: relative; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--grass); box-shadow: 0 3px 0 var(--ink); display: grid; align-content: start; }
.lane.tgt { outline: 4px solid var(--yellow); outline-offset: 1px; cursor: pointer; animation: pulse .8s infinite alternate; }
@keyframes pulse { to { outline-color: #fff; } }
.lh { text-align: center; font-family: var(--font-display); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; background: var(--ink); color: var(--cream); padding: 1px 0; }
.half { display: grid; position: relative; background-image: conic-gradient(rgba(255, 255, 255, .13) 25%, transparent 0 50%, rgba(255, 255, 255, .13) 0 75%, transparent 0); background-size: 40px 40px; }
.half.en { background-color: #86bd55; box-shadow: inset 0 0 0 100px rgba(229, 84, 63, .12); }
.half.me { background-color: #8ed05a; box-shadow: inset 0 0 0 100px rgba(61, 134, 232, .1); }
.sl { height: 84px; position: relative; border-bottom: 1px dashed rgba(27, 37, 64, .18); }
.sl:last-child { border-bottom: 0; }
.road { min-height: 26px; display: grid; place-items: center; gap: 2px; padding: 3px; background: repeating-linear-gradient(90deg, var(--dirt) 0 14px, var(--dirt-2) 14px 16px); border-block: 3px solid var(--ink); }
.shell { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-display); font-size: .78rem; color: #fff; background: var(--red-d); border: 2px solid var(--ink); border-radius: 99px; padding: 0 8px; white-space: nowrap; }
.shell::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid #fff; background: radial-gradient(#fff 0 2px, transparent 3px); }
.smokefx { position: absolute; inset: 0; pointer-events: none; z-index: 4; background: radial-gradient(circle at 25% 35%, rgba(238, 242, 245, .62) 0 22%, transparent 24%), radial-gradient(circle at 70% 25%, rgba(225, 231, 236, .62) 0 26%, transparent 28%), radial-gradient(circle at 50% 70%, rgba(236, 240, 243, .62) 0 30%, transparent 32%), radial-gradient(circle at 15% 80%, rgba(220, 227, 232, .6) 0 18%, transparent 20%), radial-gradient(circle at 85% 75%, rgba(230, 235, 239, .6) 0 22%, transparent 24%); }
.smoketag { font-family: var(--font-display); font-size: .78rem; background: #e8edf0; border: 2px solid var(--ink); border-radius: 99px; padding: 0 8px; }

/* Unités */
.u { position: absolute; inset: 0; display: block; }
.u .art { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); }
.u .nm { position: absolute; top: 1px; left: 0; right: 0; text-align: center; font-size: .66rem; font-weight: 800; color: #fff; text-shadow: -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 1px 1px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-inline: 2px; z-index: 2; }
.u .st { position: absolute; left: 3px; right: 3px; bottom: 2px; display: flex; justify-content: space-between; z-index: 2; }
.u .st i { font-style: normal; font-family: var(--font-display); font-weight: 700; font-size: .98rem; line-height: 1; min-width: 22px; padding: 2px 5px 1px; border-radius: 99px; text-align: center; border: 2px solid var(--ink); }
.u .a { background: var(--yellow); }
.u .h { background: #fff; color: var(--red-d); }
.u .h.low { background: var(--red); color: #fff; }
.u .armor, .u .zz { position: absolute; z-index: 3; font-family: var(--font-display); font-size: .72rem; line-height: 1; border: 2px solid var(--ink); border-radius: 6px; padding: 1px 4px; }
.u .armor { top: 14px; left: 3px; background: #c9d2dc; }
.u .zz { top: 14px; right: 3px; background: #fff; }
.u.wait .art { filter: saturate(.5) brightness(.94); }
.u.ghost .art { opacity: .55; filter: grayscale(.4); }
.u.ghost { border: 2px dashed var(--red-d); border-radius: 8px; inset: 3px; background: rgba(255, 255, 255, .25); }
.u.ghost .nm { color: var(--red-d); text-shadow: none; }
.u.tgt { cursor: pointer; }
.u.tgt::after { content: ""; position: absolute; inset: 2px; border: 3px solid var(--yellow); border-radius: 10px; animation: pulse .8s infinite alternate; box-shadow: 0 0 0 2px var(--ink) inset; }
.u.atk { z-index: 6; }
.u.atk .art { animation: lunge .35s; }
.me .u.atk .art { animation-name: lunge-up; }
@keyframes lunge { 40% { transform: translate(-50%, 18px) scale(1.12); } }
@keyframes lunge-up { 40% { transform: translate(-50%, -18px) scale(1.12); } }
.u.spawn .art { animation: spawn .45s; }
@keyframes spawn { from { opacity: 0; transform: translate(-50%, -26px) scale(.7); } }
.pop { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); z-index: 9; pointer-events: none; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; color: #fff; -webkit-text-stroke: 4px var(--red-d); paint-order: stroke fill; text-shadow: 0 2px 0 var(--ink); animation: pop .9s forwards; white-space: nowrap; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -34px); } }
.boom { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; z-index: 8; pointer-events: none; background: radial-gradient(circle, #fff 0 18%, var(--yellow) 19% 45%, #ff8a2a 46% 70%, transparent 71%); clip-path: polygon(50% 0, 62% 24%, 88% 12%, 76% 38%, 100% 50%, 76% 62%, 88% 88%, 62% 76%, 50% 100%, 38% 76%, 12% 88%, 24% 62%, 0 50%, 24% 38%, 12% 12%, 38% 24%); animation: boom .55s forwards; }
@keyframes boom { from { transform: scale(.2) rotate(-20deg); } 60% { transform: scale(1.2) rotate(8deg); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
.phase { display: flex; justify-content: center; min-height: 40px; }

.hint { background: var(--yellow); border: 3px solid var(--ink); border-radius: 12px; padding: 8px 12px; box-shadow: 0 3px 0 var(--ink); }
.status { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.supply { display: flex; gap: 5px; align-items: center; font-family: var(--font-display); font-size: 1rem; text-transform: uppercase; background: var(--cream); border: 3px solid var(--ink); border-radius: 99px; padding: 2px 12px; }
.supply .pip { width: 16px; height: 16px; border-radius: 4px; background: var(--yellow); border: 2px solid var(--ink); }
.supply .pip.off { background: #fff; opacity: .5; }

/* Cartes */
.hand { display: flex; gap: 10px; overflow-x: auto; padding: 16px 12px 12px; scroll-snap-type: x proximity; }
.card {
  flex: none; width: 122px; scroll-snap-align: start; position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 3px; text-align: left; align-content: start;
  padding: 7px 7px 8px; border-radius: 12px; border: 3px solid var(--ink); background: var(--cream); box-shadow: 0 4px 0 var(--ink); color: var(--ink); transition: transform .12s;
}
.card .cn { font-family: var(--font-display); font-weight: 700; font-size: .86rem; line-height: 1.05; padding-left: 17px; min-height: 1.1em; overflow-wrap: break-word; }
.card .art { display: grid; place-items: center; border-radius: 8px; border: 2px solid var(--ink); height: 70px; background: var(--grass); overflow: hidden; }
.card.order .art { background: var(--sky-2); }
.card .ct { font-size: .74rem; line-height: 1.12; font-weight: 700; min-height: 3.4em; }
.card .cs { display: flex; gap: 6px; font-family: var(--font-display); font-size: 1rem; }
.card .cs i { font-style: normal; padding: 0 8px; border-radius: 99px; border: 2px solid var(--ink); background: var(--yellow); }
.card .cs i.h { background: #fff; color: var(--red-d); }
.card .cost { position: absolute; top: -11px; left: -9px; width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; background: var(--yellow); color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; border: 3px solid var(--ink); box-shadow: 0 2px 0 var(--ink); }
.card.unit { background: #dcecff; }
.card.order { background: #ffe7bf; }
.card.sel { transform: translateY(-14px); box-shadow: 0 0 0 4px var(--yellow), 0 4px 0 4px var(--ink); }
.card.off { opacity: .5; filter: saturate(.5); }
.cardrow { display: flex; gap: 14px; padding-inline: 4px; flex-wrap: wrap; justify-content: center; padding-block: 16px; }
.cardrow .card { cursor: pointer; width: calc((100% - 28px) / 3); min-width: 108px; }
.cardrow .card:hover { transform: translateY(-5px); }

.officers { display: grid; gap: 8px; }
.off-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; border: 3px solid var(--ink); background: var(--cream); box-shadow: 0 3px 0 var(--ink); text-align: left; }
.off-item .tx { display: grid; gap: 1px; min-width: 0; }
.off-item.plain { grid-template-columns: 1fr; }
button.off-item:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.off-item b { font-family: var(--font-display); font-size: 1.05rem; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { font-style: normal; font-family: var(--font-display); padding: 0 8px; border-radius: 99px; border: 2px solid var(--ink); background: var(--yellow); }
.legend i.h { background: #fff; color: var(--red-d); }

.lines { display: grid; gap: 6px; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(27, 37, 64, .72); display: grid; place-items: center; padding: 14px; }
.modal .box { background: var(--cream); border: 3px solid var(--ink); border-radius: 16px; padding: 16px; width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; display: grid; gap: 12px; box-shadow: 0 6px 0 var(--ink); }
.modal ol { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
.deckgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(122px, 1fr)); gap: 16px 10px; padding-top: 10px; }
.deckgrid .card { width: auto; }
.deckgrid .card.pick { cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--cream); border-radius: 99px; padding: 10px 18px; z-index: 80; max-width: calc(100% - 28px); text-align: center; }
.end { justify-items: center; text-align: center; }
.end .big { font-family: var(--font-display); font-weight: 700; font-size: 3.4rem; line-height: 1; text-transform: uppercase; color: var(--yellow); text-shadow: 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 5px 0 var(--ink); }
.end .big.lose { color: var(--red); }
/* Carte */
.map { position: relative; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); overflow: hidden; background-color: #97d764; background-image: conic-gradient(rgba(255, 255, 255, .14) 25%, transparent 0 50%, rgba(255, 255, 255, .14) 0 75%, transparent 0); background-size: 48px 48px; }
.mapsvg { position: absolute; inset: 0; width: 100%; height: 100%; }
.road-o { stroke: var(--ink); stroke-width: 12px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.road-i { stroke: var(--dirt); stroke-width: 7px; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.road-i.taken { stroke: #6fb0f5; }
.deco { position: absolute; transform: translate(-50%, -50%); opacity: .9; pointer-events: none; }
.start { position: absolute; transform: translate(-50%, -100%); font-family: var(--font-display); background: var(--ink); color: var(--cream); border-radius: 8px; padding: 1px 12px; font-size: .85rem; }
.node { position: absolute; transform: translate(-50%, -50%); width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--ink); background: #e9eef5; box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; padding: 0; z-index: 2; filter: brightness(.86) saturate(.65); }
.node .ic { display: grid; place-items: center; }
.node .lb { position: absolute; top: 100%; margin-top: 5px; left: 50%; transform: translateX(-50%); font-size: .68rem; font-weight: 800; line-height: 1.05; background: var(--cream); border: 2px solid var(--ink); border-radius: 8px; padding: 1px 6px; text-align: center; width: max-content; max-width: 92px; color: var(--ink); }
.node .otag { position: absolute; top: -9px; right: -14px; font-family: var(--font-display); font-size: .7rem; background: var(--yellow); border: 2px solid var(--ink); border-radius: 99px; padding: 0 6px; color: var(--ink); }
.node .otag.el { background: var(--red); color: #fff; }
.node.battle { background: #ffc9c0; } .node.elite { background: #ff9d8a; } .node.boss { background: #ff7b66; width: 68px; height: 68px; }
.node.camp { background: #b9ecb0; } .node.depot { background: #ffe39b; } .node.staff { background: #bcd9ff; }
.node.reach { filter: none; cursor: pointer; animation: bob .9s ease-in-out infinite alternate; box-shadow: 0 4px 0 var(--ink), 0 0 0 5px var(--yellow); }
@keyframes bob { to { transform: translate(-50%, -58%); } }
.node.done { filter: grayscale(.7) brightness(.92); }
.node.done::after { content: "✓"; position: absolute; right: -4px; top: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; border: 2px solid var(--ink); display: grid; place-items: center; font-size: .8rem; }
.node.cur { filter: none; box-shadow: 0 4px 0 var(--ink), 0 0 0 5px var(--blue); }
.chip { display: inline-block; }
.nodeart { flex: none; width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; display: grid; place-items: center; }
.objline { text-align: center; font-weight: 800; font-size: .92rem; background: var(--cream); border: 3px solid var(--ink); border-radius: 10px; padding: 3px 10px; }
/* Groupes, couleurs, fusion, marine et air */
.cchip { position: absolute; top: 3px; left: 3px; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--ink); z-index: 3; }
.u .st i { min-width: 30px; font-size: .9rem; }
.u .art { top: 14px; }
.supzone { border-top: 3px solid var(--ink); }
.sl.sup { height: 62px; background: linear-gradient(180deg, #8fd3f7, #5fb5ea); background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 10px, transparent 10px 24px), linear-gradient(180deg, #8fd3f7, #5fb5ea); display: grid; place-items: center; overflow: hidden; }
.sl.sup .art { top: 3px; }
.sl.sup .u { inset: 0; }
.suphint { font-family: var(--font-display); font-size: .78rem; color: rgba(27, 37, 64, .55); letter-spacing: .08em; text-transform: uppercase; }
.card { width: 134px; grid-template-rows: none; align-content: start; gap: 4px; }
.card .cband { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; margin: 0 -2px; padding: 2px 7px 2px 22px; border: 2px solid var(--ink); border-radius: 8px; color: #fff; text-shadow: -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 1px 1px 0 var(--ink); font-size: .8rem; }
.card .cband b { font-family: var(--font-display); font-weight: 700; }
.card .cband small { font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; }
.card .cn { padding-left: 2px; font-size: .95rem; }
.card .art { height: 66px; }
.card .cst { font-family: var(--font-display); font-size: .78rem; line-height: 1.1; background: var(--cream); border: 2px solid var(--ink); border-radius: 6px; padding: 2px 5px; }

<script>
// ==CORE==
// ---- Couleurs : chaque couleur donne un avantage ; deux couleurs fusionnées les cumulent ----
const COLORS = {
  J: { name: 'Jaune', hex: '#ffd24a', txt: '+1 dégât par tir' },
  R: { name: 'Rouge', hex: '#e5543f', txt: "+50 % d'effectif (tirs et PV)" },
  V: { name: 'Vert', hex: '#52b34f', txt: '+50 % de PV (marine et air : +1 tour)' },
  N: { name: 'Noir', hex: '#39404f', txt: "Perce 1 de blindage, agit dès l'arrivée" },
};
const MIXES = { JR: ['Orange', '#ff9a2a'], JV: ['Citron', '#c3e03a'], JN: ['Olive', '#8c8a2e'], RV: ['Brique', '#a8573a'], RN: ['Bordeaux', '#8a2347'], VN: ['Sapin', '#1f6a45'] };
const COL_ORDER = 'JRVN';
const normCols = s => [...s].sort((a, b) => COL_ORDER.indexOf(a) - COL_ORDER.indexOf(b)).join('');
const colorName = c => (c.length === 1 ? COLORS[c].name : MIXES[c][0]);
const colorHex = c => (c.length === 1 ? COLORS[c].hex : MIXES[c][1]);

// ---- Types de cartes. men = nombre d'hommes (= nombre de tirs), dmg = dégâts par tir, hpm = PV par homme ----
const FAMILIES = { terre: 'Armée de terre', mer: 'Marine', air: "Armée de l'air" };
const TYPES = {
  tireurs: { fam: 'terre', land: true, name: 'Tireurs', cost: 2, men: 10, dmg: 1, hpm: 1, armor: 0, rar: 1, txt: '10 tireurs : 10 tirs de 1 dégât.' },
  spiders: { fam: 'terre', land: true, name: 'Spiders', cost: 2, men: 3, dmg: 3, hpm: 3, armor: 0, kw: ['flank'], rar: 1, txt: "3 marcheurs mécaniques. Contournent : frappent l'unité du fond." },
  blinde: { fam: 'terre', land: true, name: 'Blindé', cost: 3, men: 1, dmg: 6, hpm: 16, armor: 2, rar: 2, txt: '1 char. Blindage 2 : les petits tirs ne passent pas.' },
  destroyer: { fam: 'mer', name: 'Destroyer', cost: 2, men: 4, dmg: 1, ttl: 3, kw: ['spread'], rar: 1, txt: '4 tirs répartis sur les ennemis de sa ligne. Reste 3 tours.' },
  croiseur: { fam: 'mer', name: 'Croiseur', cost: 3, men: 1, dmg: 7, ttl: 3, pierce: 9, rar: 3, txt: '1 gros obus de 7, ignore le blindage. Reste 3 tours.' },
  sousmarin: { fam: 'mer', name: 'Sous-marin', cost: 2, men: 1, dmg: 5, ttl: 3, pierce: 2, kw: ['heavy'], rar: 2, txt: "1 torpille de 5 sur l'ennemi le plus solide de sa ligne. Reste 3 tours." },
  chasseur: { fam: 'air', name: 'Chasseur', cost: 2, men: 2, dmg: 2, ttl: 2, kw: ['hunt', 'cover'], rar: 1, txt: "2 tirs de 2 sur les ennemis les plus faibles. Annule l'obus visant sa ligne. 2 tours." },
  bombardier: { fam: 'air', name: 'Bombardier', cost: 3, men: 1, dmg: 4, ttl: 1, kw: ['bomb'], rar: 3, txt: '4 dégâts à chaque ennemi de sa ligne. 1 tour.' },
  paras: { fam: 'air', land: true, name: 'Parachutistes', cost: 2, men: 6, dmg: 1, hpm: 1, armor: 0, kw: ['raid'], rar: 2, txt: "6 parachutistes. Attaquent dès l'arrivée." },
};
const TYPE_KEYS = Object.keys(TYPES);
TYPE_KEYS.forEach(k => { TYPES[k].id = k; });
// Entraînement : bonus gagnés au niveau 2, puis au niveau 3
const UP = {
  tireurs: [{ men: 3 }, { men: 3 }], spiders: [{ men: 1 }, { men: 1 }], blinde: [{ dmg: 1 }, { hpm: 4 }], destroyer: [{ men: 2 }, { men: 2 }],
  croiseur: [{ dmg: 2 }, { dmg: 2 }], sousmarin: [{ dmg: 2 }, { dmg: 2 }], chasseur: [{ men: 1 }, { men: 1 }], bombardier: [{ dmg: 2 }, { dmg: 2 }], paras: [{ men: 3 }, { men: 3 }],
};
function upText(t, lvl) {
  const u = (UP[t] || [])[lvl - 2] || {};
  return [u.men ? `+${u.men} homme${u.men > 1 ? 's' : ''}` : '', u.dmg ? `+${u.dmg} dégât${u.dmg > 1 ? 's' : ''} par tir` : '', u.hpm ? `+${u.hpm} PV par homme` : ''].filter(Boolean).join(', ');
}
// ---- Cartes : {t: type, c: couleurs}. Une carte fusionnée a des parts ----
const mkCard = (t, c) => ({ t, c });
const START_DECK = [mkCard('tireurs', 'J'), mkCard('tireurs', 'R'), mkCard('spiders', 'V'), mkCard('spiders', 'N'), mkCard('blinde', 'J'), mkCard('blinde', 'V'),
  mkCard('destroyer', 'V'), mkCard('destroyer', 'R'), mkCard('croiseur', 'N'), mkCard('chasseur', 'J'), mkCard('chasseur', 'N')];
const cardKey = c => c.t + ':' + c.c + ':' + (c.lv || 1);

const ENEMIES = {
  rifle: { name: 'Soldats', men: 6, dmg: 1, hpm: 1, armor: 0, val: 1 },
  gren: { name: 'Grenadiers', men: 3, dmg: 2, hpm: 2, armor: 0, val: 1.5 },
  mgnest: { name: 'Mitrailleuse', men: 4, dmg: 2, hpm: 3, armor: 0, val: 2 },
  sniper: { name: 'Snipers', men: 2, dmg: 3, hpm: 2, armor: 0, kw: ['weak'], val: 2 },
  panzer: { name: 'Panzer', men: 1, dmg: 6, hpm: 16, armor: 2, val: 4 },
  heavy: { name: 'Char lourd', men: 1, dmg: 8, hpm: 30, armor: 3, val: 99 },
};
const LEVELS = [
  { name: "Plage d'assaut", hq: 50, budget: 2.4 },
  { name: 'Bocage', hq: 64, budget: 4.7 },
  { name: 'Village fortifié', hq: 76, budget: 5.3 },
  { name: 'Le pont (boss)', hq: 100, budget: 4.6, boss: 'heavy' },
  { name: 'Forêt des Ardennes', hq: 112, budget: 6.2 },
  { name: 'Ville en ruines', hq: 130, budget: 7.0 },
  { name: 'Ligne de défense', hq: 148, budget: 7.8 },
  { name: 'Quartier général (boss)', hq: 165, budget: 5.2, boss: 'heavy2' },
];
// Cartes joker : effets permanents (5 au maximum), achetés avec le butin de guerre ou gagnés en campagne.
const JOKERS = [
  { id: 'moreau', name: 'Capitaine Moreau', cost: 8, desc: 'Vos unités terrestres ont +25 % de PV.' },
  { id: 'dubois', name: 'Lieutenant Dubois', cost: 9, desc: 'Vos unités terrestres font +1 dégât par tir.' },
  { id: 'ashby', name: 'Colonel Ashby', cost: 9, desc: 'Vous piochez 1 carte de plus par tour.' },
  { id: 'kowalski', name: 'Major Kowalski', cost: 11, desc: '+1 ravitaillement par tour.' },
  { id: 'meyer', name: 'Docteur Meyer', cost: 8, desc: 'Fin du tour : vos unités terrestres regagnent 20 % de PV.' },
  { id: 'ito', name: 'Sergent Ito', cost: 8, desc: 'La première carte jouée chaque tour coûte 1 de moins.' },
  { id: 'silva', name: 'Commandant Silva', cost: 7, desc: "Les cartes de marine et d'air coûtent 1 de moins." },
  { id: 'brandt', name: 'Général Brandt', cost: 9, desc: 'Votre QG gagne +20 PV max (et se soigne de 20).' },
  { id: 'peintre', name: 'Peintre de guerre', cost: 9, desc: 'Les cartes fusionnées font +1 dégât par tir.' },
  { id: 'soleil', name: 'Capitaine Soleil', cost: 8, desc: 'Les cartes jaunes ont +1 dégât par tir de plus.' },
  { id: 'braise', name: 'Commandant Braise', cost: 8, desc: "Les cartes rouges ont +25 % d'effectif de plus." },
  { id: 'mousse', name: 'Docteur Mousse', cost: 8, desc: 'Les cartes vertes ont +25 % de PV de plus.' },
  { id: 'ombre', name: 'Agent Ombre', cost: 8, desc: 'Les cartes noires percent 1 blindage de plus.' },
  { id: 'amiral', name: 'Amiral Vague', cost: 7, desc: "La marine et l'air restent 1 tour de plus." },
  { id: 'fort', name: 'Intendant Fort', cost: 7, desc: 'Premier tour de chaque bataille : +2 ravitaillement.' },
  { id: 'quartier', name: 'Quartier-maître', cost: 11, desc: 'Le butin de guerre gagne +50 %.' },
];
const OFFICERS = JOKERS;
const MAX_JOKERS = 5;
const HQ_START = 60;

function shuffle(a, rng = Math.random) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const clone = o => JSON.parse(JSON.stringify(o));
const has = (S, id) => S.officers.includes(id);

// ---- Calcul des caractéristiques d'une unité selon sa carte (type, couleurs, niveau) et les jokers ----
function statsFor(def, cols, S, side, lv) {
  let men = def.men, dmg = def.dmg, hpm = def.hpm || 0, ttl = def.ttl || 0, pierce = def.pierce || 0, raid = (def.kw || []).includes('raid'), vert = false;
  const me = side === 'me', J = k => me && S && has(S, k);
  for (let i = 0; i < (lv || 1) - 1; i++) { const u = (UP[def.id] || [])[i] || {}; men += u.men || 0; dmg += u.dmg || 0; hpm += u.hpm || 0; }
  const baseMen = men;
  for (const ch of cols || '') {
    if (ch === 'J') dmg += 1 + (J('soleil') ? 1 : 0);
    if (ch === 'R') men += Math.max(1, Math.floor(baseMen * 0.5)) + (J('braise') ? Math.max(1, Math.floor(baseMen * 0.25)) : 0);
    if (ch === 'V') vert = true;
    if (ch === 'N') { pierce += 1 + (J('ombre') ? 1 : 0); raid = true; }
  }
  if (J('peintre') && (cols || '').length === 2) dmg += 1;
  let hp = hpm ? men * hpm : 0;
  if (vert) { hp = Math.ceil(hp * 1.5); if (J('mousse')) hp = Math.ceil(hp * 1.25); if (def.ttl) ttl += 1; }
  if (me && def.ttl && J('amiral')) ttl += 1;
  if (me && def.land) {
    if (J('dubois')) dmg += 1;
    if (J('moreau')) hp = Math.ceil(hp * 1.25);
  }
  return { men, dmg, hp, ttl, pierce, raid };
}
function mkUnit(S, side, key, cols, lv) {
  const def = side === 'me' ? TYPES[key] : ENEMIES[key], st = statsFor(def, cols, S, side, lv);
  return {
    uid: S.uid++, side, key, cols: cols || '', name: def.name, lv: lv || 1, men: st.men, menMax: st.men, dmg: st.dmg, hp: st.hp, hpMax: st.hp,
    armor: def.armor || 0, pierce: st.pierce, ttl: st.ttl, kw: def.kw || [], land: side === 'en' || !!def.land, fam: def.fam || 'terre',
    fresh: (side === 'en' || !!def.land) && !st.raid,
  };
}
// Nombre d'hommes (donc de tirs) encore valides
const shotsOf = u => (u.hpMax > 0 ? Math.max(1, Math.ceil((u.menMax * u.hp) / u.hpMax)) : u.menMax);

function newBattle(C, rng = Math.random, cfg = null) {
  const lvl = cfg || LEVELS[C.level];
  const S = {
    level: lvl.levelIdx !== undefined ? lvl.levelIdx : C.level, lvl, rng, obj: lvl.obj || { type: 'hq' }, kills: 0, uid: 1, turn: 1, over: null,
    officers: C.officers.slice(), hq: { me: C.hq, en: lvl.obj && lvl.obj.type === 'hold' ? 9999 : lvl.hq }, hqMax: C.hqMax,
    lanes: [0, 1, 2].map(() => ({ me: [null, null], en: [null, null], sup: null })),
    draw: shuffle(C.deck.slice(), rng), hand: [], discard: [], supply: 0, flags: {}, plan: [],
  };
  if (lvl.tutorial) ['tireurs:R', 'tireurs:J'].forEach(k => { const i = S.draw.findIndex(c => cardKey(c) === k); if (i >= 0) S.draw.push(S.draw.splice(i, 1)[0]); });
  if (lvl.boss) deploy(S, 'en', 1, 'heavy');
  if (lvl.boss === 'heavy2') deploy(S, 'en', 0, 'panzer');
  S.plan = genPlan(S);
  startTurn(S);
  return S;
}
function startTurn(S) {
  S.supply = 4 + (has(S, 'kowalski') ? 1 : 0) + (has(S, 'fort') && S.turn === 1 ? 2 : 0);
  S.flags = { used: false };
  drawCards(S, 5 + (has(S, 'ashby') ? 1 : 0));
}
function drawCards(S, n) {
  for (let i = 0; i < n; i++) {
    if (!S.draw.length) { if (!S.discard.length) return; S.draw = shuffle(S.discard.splice(0), S.rng); }
    S.hand.push(S.draw.pop());
  }
}
function deploy(S, side, lane, key, cols, lv) {
  const u = mkUnit(S, side, key, cols, lv); u.lane = lane;
  if (side === 'me' && !u.land) { if (S.lanes[lane].sup) return null; S.lanes[lane].sup = u; return u; }
  const slots = S.lanes[lane][side], i = slots[0] ? (slots[1] ? -1 : 1) : 0;
  if (i < 0) return null;
  slots[i] = u; return u;
}
const units = (S, side) => S.lanes.flatMap(l => l[side].filter(Boolean));
const supports = S => S.lanes.map(l => l.sup).filter(Boolean);
const compact = (S, lane, side) => { const s = S.lanes[lane][side]; if (!s[0] && s[1]) { s[0] = s[1]; s[1] = null; } };

// ---- Coût, cibles, jeu d'une carte ----
function cardCost(S, card) {
  const def = TYPES[card.t]; let cost = def.cost;
  if (has(S, 'silva') && def.fam !== 'terre') cost -= 1;
  if (has(S, 'ito') && !S.flags.used) cost -= 1;
  return Math.max(0, cost);
}
function targetsFor(S, card) {
  const def = TYPES[card.t];
  if (def.land) return [0, 1, 2].filter(l => !S.lanes[l].me[1]).map(l => ({ lane: l }));
  return [0, 1, 2].filter(l => !S.lanes[l].sup).map(l => ({ lane: l }));
}
const isPlayable = (S, hi) => !S.over && S.hand[hi] && cardCost(S, S.hand[hi]) <= S.supply && targetsFor(S, S.hand[hi]).length > 0;
function playCard(S, hi, tgt) {
  const card = S.hand[hi];
  if (!card || S.over || !isPlayable(S, hi) || !targetsFor(S, card).some(t => t.lane === tgt.lane)) return null;
  S.supply -= cardCost(S, card); S.flags.used = true;
  S.hand.splice(hi, 1); discardCard(S, card);
  const u = deploy(S, 'me', tgt.lane, card.t, card.c, card.lv);
  return [{ uid: u.uid, spawn: true, lane: u.lane, side: 'me' }];
}
function discardCard(S, card) { if (card.parts) S.discard.push(...card.parts); else S.discard.push(card); }

// ---- Fusion : deux cartes du même type et de couleurs différentes forment une carte à deux couleurs ----
const canFuse = (a, b) => !!a && !!b && a !== b && a.t === b.t && !a.parts && !b.parts && a.c.length === 1 && b.c.length === 1 && a.c !== b.c;
function fuseCards(S, i, j) {
  const a = S.hand[i], b = S.hand[j];
  if (S.over || !canFuse(a, b)) return null;
  const card = { t: a.t, c: normCols(a.c + b.c), lv: Math.max(a.lv || 1, b.lv || 1), parts: [a, b] };
  S.hand.splice(Math.max(i, j), 1); S.hand.splice(Math.min(i, j), 1, card);
  return card;
}
function splitCard(S, i) {
  const c = S.hand[i];
  if (!c || !c.parts) return null;
  S.hand.splice(i, 1, ...c.parts);
  return c.parts;
}

// ---- Dégâts ----
function applyDamage(S, u, dmg) {
  u.hp -= dmg;
  const hit = { uid: u.uid, dmg, kill: u.hp <= 0, lane: u.lane, side: u.side };
  if (hit.kill) { const s = S.lanes[u.lane][u.side]; s[s.indexOf(u)] = null; compact(S, u.lane, u.side); if (u.side === 'en') S.kills++; }
  return hit;
}
function findUnit(S, uid) { return units(S, 'me').concat(units(S, 'en'), supports(S)).find(u => u.uid === uid); }
function checkOver(S) {
  if (S.hq.me <= 0) S.over = 'lose';
  else if (S.hq.en <= 0 || (S.obj.type === 'kills' && S.kills >= S.obj.n)) S.over = 'win';
}

// ---- Plan ennemi, annoncé un tour à l'avance ----
function genPlan(S) {
  const L = S.lvl, rng = S.rng, lv = S.level;
  let budget = L.budget + S.turn * 0.35;
  const free = [0, 1, 2].map(l => S.lanes[l].en.filter(x => !x).length), plan = [];
  const pool = [['rifle', 1, 4], ['gren', 1.5, 3]];
  if (lv >= 1) pool.push(['mgnest', 2, 2]);
  if (lv >= 2) pool.push(['sniper', 2, 1.5], ['shell', 2, 1.5]);
  if (lv >= 3) pool.push(['panzer', 4, 1.2]);
  while (budget >= 1 && plan.length < 4) {
    const opts = pool.filter(p => p[1] <= budget && (p[0] === 'shell' || free.some(f => f > 0)));
    if (!opts.length) break;
    let x = rng() * opts.reduce((s, p) => s + p[2], 0), pick = opts[0];
    for (const p of opts) { if (x < p[2]) { pick = p; break; } x -= p[2]; }
    budget -= pick[1];
    if (pick[0] === 'shell') { plan.push({ k: 'shell', lane: Math.floor(rng() * 3), dmg: lv >= 5 ? 12 : 8 }); continue; }
    const lanes = [0, 1, 2].filter(l => free[l] > 0), lane = lanes[Math.floor(rng() * lanes.length)];
    free[lane]--; plan.push({ k: 'deploy', lane, key: pick[0] });
  }
  return plan;
}

// ---- Résolution du tour ----
const snap = S => ({ lanes: clone(S.lanes), hq: { ...S.hq } });
function pickTarget(S, u, i) {
  const foe = u.side === 'me' ? 'en' : 'me', row = S.lanes[u.lane][foe].filter(Boolean);
  if (u.kw.includes('hunt')) { const all = units(S, foe); return all.length ? all.reduce((a, b) => (b.hp < a.hp ? b : a)) : null; }
  if (!row.length) return null;
  if (u.kw.includes('weak')) return row.reduce((a, b) => (b.hp < a.hp ? b : a));
  if (u.kw.includes('heavy')) return row.reduce((a, b) => (b.hp > a.hp ? b : a));
  if (u.kw.includes('flank')) return row[1] || row[0];
  if (u.kw.includes('spread')) return row[i % row.length];
  return row[0];
}
function attack(S, u, steps) {
  const foe = u.side === 'me' ? 'en' : 'me', acc = new Map(), hq = { n: 0 };
  const record = h => { const p = acc.get(h.uid); if (p) { p.dmg += h.dmg; p.kill = p.kill || h.kill; } else acc.set(h.uid, { ...h }); };
  const dmgVs = t => Math.max(0, u.dmg - Math.max(0, t.armor - u.pierce));
  if (u.kw.includes('bomb')) {
    for (let b = 0; b < u.menMax; b++) {
      const row = S.lanes[u.lane][foe].filter(Boolean);
      if (!row.length) { hq.n += u.dmg; continue; }
      row.forEach(t => { const d = dmgVs(t); if (d > 0) record(applyDamage(S, t, d)); });
    }
  } else {
    const shots = u.land ? shotsOf(u) : u.menMax;
    for (let i = 0; i < shots; i++) {
      const t = pickTarget(S, u, i);
      if (!t) { if (!u.kw.includes('hunt')) hq.n += u.dmg; continue; }
      const d = dmgVs(t); if (d > 0) record(applyDamage(S, t, d));
    }
  }
  const hits = [...acc.values()];
  if (hq.n > 0) { S.hq[foe] -= hq.n; hits.push({ hq: foe, dmg: hq.n }); }
  if (!hits.length) hits.push({ uid: u.uid, dmg: 0, miss: true, lane: u.lane, side: u.side });
  checkOver(S);
  steps.push({ ph: S.phase, from: u.uid, hits, snap: snap(S) });
}
function combat(S, side, steps) {
  const order = [];
  for (let l = 0; l < 3; l++) {
    S.lanes[l][side].filter(Boolean).forEach(u => { if (!u.fresh) order.push(u); });
    if (side === 'me' && S.lanes[l].sup) order.push(S.lanes[l].sup);
  }
  for (const u of order) {
    if (S.over) return;
    if (u.land && !S.lanes[u.lane][side].includes(u)) continue;
    attack(S, u, steps);
  }
}
function endTurn(S) {
  const steps = [];
  S.phase = 'me';
  S.hand.splice(0).forEach(c => discardCard(S, c));
  combat(S, 'me', steps);
  if (S.over) return steps;
  units(S, 'me').forEach(u => { u.fresh = false; });
  if (has(S, 'meyer')) units(S, 'me').forEach(a => { a.hp = Math.min(a.hpMax, a.hp + Math.ceil(a.hpMax * 0.2)); });
  S.lanes.forEach(l => { if (l.sup && --l.sup.ttl <= 0) l.sup = null; });
  S.phase = 'en';
  steps.push({ ph: 'en', msg: 'Tour ennemi', snap: snap(S) });
  for (const p of S.plan.filter(p => p.k === 'shell')) {
    const covered = S.lanes[p.lane].sup && S.lanes[p.lane].sup.kw.includes('cover');
    if (covered) { steps.push({ ph: 'en', shell: p.lane, hits: [], cancel: p.lane, snap: snap(S) }); continue; }
    const t = S.lanes[p.lane].me[0], hits = [];
    if (t) hits.push(applyDamage(S, t, p.dmg)); else { S.hq.me -= p.dmg; hits.push({ hq: 'me', dmg: p.dmg }); }
    checkOver(S); steps.push({ ph: 'en', shell: p.lane, hits, snap: snap(S) });
    if (S.over) return steps;
  }
  for (const p of S.plan.filter(p => p.k === 'deploy')) {
    let lane = p.lane;
    if (S.lanes[lane].en[1]) lane = [0, 1, 2].find(l => !S.lanes[l].en[1]);
    if (lane === undefined) continue;
    const u = deploy(S, 'en', lane, p.key);
    steps.push({ ph: 'en', hits: [{ uid: u.uid, spawn: true, lane: u.lane, side: 'en' }], snap: snap(S) });
  }
  combat(S, 'en', steps);
  if (S.over) return steps;
  units(S, 'en').forEach(u => { u.fresh = false; });
  S.turn++;
  if (S.obj.type === 'hold' && S.turn > S.obj.n) { S.over = 'win'; return steps; }
  S.plan = genPlan(S);
  startTurn(S);
  return steps;
}

// ---- Carte de campagne ----
const LAYER_SIZES = [1, 2, 3, 2, 1, 3, 3, 2, 1];
const LAYER_POOLS = [['battle'], ['battle', 'battle', 'depot'], ['battle', 'elite', 'staff'], ['battle', 'camp', 'battle'], ['boss'],
  ['battle', 'elite', 'depot'], ['battle', 'staff', 'battle'], ['camp', 'battle', 'battle'], ['boss']];
const LAYER_LEVEL = [0, 1, 1, 2, 3, 4, 5, 6, 7];
const PLACES = ["Plage d'assaut", 'Bocage', 'Ferme des Trois Chênes', 'Carrefour de la Croix', 'Colline 62', 'Village fortifié', 'Haies normandes', 'Gare de triage',
  'Forêt des Ardennes', 'Ville en ruines', 'Aérodrome', 'Ligne de défense', 'Col des Vosges', 'Faubourg nord', 'Usine désaffectée', 'Pont du Rhin'];
const NODE_LABEL = { battle: 'Bataille', elite: 'Bataille d’élite', boss: 'Boss', camp: 'Camp de base', depot: 'Dépôt de ravitaillement', staff: 'État-major' };

function genMap(rng = Math.random) {
  const places = shuffle(PLACES.slice(), rng);
  const layers = LAYER_SIZES.map((size, l) => {
    let types = shuffle(LAYER_POOLS[l].slice(), rng).slice(0, size);
    if (l > 0 && size > 1 && !types.includes('battle')) types[0] = 'battle';
    return types.map((type, i) => {
      const node = { id: l + '-' + i, layer: l, i, type, levelIdx: LAYER_LEVEL[l], next: [] };
      if (type === 'boss') node.name = l === 4 ? 'Le pont' : 'Quartier général';
      else if (type === 'battle' || type === 'elite') node.name = places.pop();
      else node.name = NODE_LABEL[type];
      if (type === 'battle' && l > 0) { const r = rng(); node.obj = r < 0.6 ? { type: 'hq' } : r < 0.8 ? { type: 'hold', n: 5 + (node.levelIdx >= 4 ? 1 : 0) + (node.levelIdx >= 6 ? 1 : 0) } : { type: 'kills', n: 6 + Math.floor(node.levelIdx / 2) }; }
      else if (type === 'battle' || type === 'elite' || type === 'boss') node.obj = { type: 'hq' };
      return node;
    });
  });
  for (let l = 0; l < layers.length - 1; l++) {
    const a = layers[l], b = layers[l + 1], inc = b.map(() => 0);
    a.forEach((n, i) => {
      const pos = a.length === 1 ? null : (i * (b.length - 1)) / (a.length - 1);
      const t = pos === null ? b.map((_, j) => j) : [...new Set([Math.floor(pos), Math.ceil(pos)])];
      n.next = t; t.forEach(j => { inc[j]++; });
    });
    inc.forEach((c, j) => { if (!c) { const i = Math.min(a.length - 1, Math.round((j * (a.length - 1)) / Math.max(1, b.length - 1))); a[i].next.push(j); a[i].next.sort(); } });
  }
  return layers;
}
function battleCfg(node) {
  const base = LEVELS[node.levelIdx], elite = node.type === 'elite', o = node.obj || { type: 'hq' };
  const mult = (elite ? 1.18 : 1) * (o.type === 'hold' ? 1.35 : o.type === 'kills' ? 1.15 : 1);
  return { name: node.name, hq: base.hq, budget: base.budget * mult, boss: node.type === 'boss' ? base.boss : undefined,
    levelIdx: node.levelIdx, obj: node.obj || { type: 'hq' }, elite, tutorial: node.layer === 0 };
}
// Cartes proposées en récompense : type et couleur tirés au hasard
function rewardCards(rng = Math.random, minRar = 1) {
  const keys = TYPE_KEYS.filter(k => TYPES[k].rar >= minRar), out = [];
  while (out.length < 3) {
    const w = k => [0, 4, 3, 1.5][TYPES[k].rar];
    let x = rng() * keys.reduce((s, k) => s + w(k), 0), t = keys[0];
    for (const k of keys) { if (x < w(k)) { t = k; break; } x -= w(k); }
    const c = 'JRVN'[Math.floor(rng() * 4)];
    if (!out.some(o => o.t === t && o.c === c)) out.push(mkCard(t, c));
  }
  return out;
}

// ---- Butin de guerre et intendance ----
function lootFor(S, C, nodeType) {
  const base = { battle: 4, elite: 6, boss: 9 }[nodeType] || 4, lines = [['Victoire', base]];
  const speed = Math.max(0, Math.min(2, 6 - S.turn)); if (speed) lines.push(['Victoire rapide', speed]);
  if (S.hq.me >= S.hqMax * 0.8) lines.push(['QG intact', 1]);
  const interest = Math.min(1, Math.floor((C.loot || 0) / 5)); if (interest) lines.push(['Intérêts', interest]);
  let total = lines.reduce((t, l) => t + l[1], 0);
  if (has(S, 'quartier')) { const b = Math.ceil(total * 0.5); lines.push(['Quartier-maître', b]); total += b; }
  return { lines, total };
}
const cardPrice = c => [0, 4, 5, 6][TYPES[c.t].rar] + ((c.lv || 1) > 1 ? 2 : 0);
const upgradeCost = card => ((card.lv || 1) === 1 ? 6 : 10);
const canUpgrade = card => (card.lv || 1) < 3;
const REFORM_COST = 3;
function genShop(C, rng = Math.random, rare = false) {
  const owned = new Set(C.officers);
  const jokers = shuffle(JOKERS.filter(j => !owned.has(j.id)), rng).slice(0, 2).map(j => ({ id: j.id, price: j.cost }));
  const cards = rewardCards(rng, rare ? 2 : 1).slice(0, 2).map(c => ({ card: c, price: cardPrice(c) }));
  return { jokers, cards, rerolls: 0 };
}

}
function finishBattle() {
  busy = true;
  setTimeout(() => {
    if (S.over === 'win') { SFX.play('win'); return toReward(); }
    SFX.play('lose');
    app.innerHTML = `<div class="stack end"><div class="big lose">Défaite</div>${spriteSVG('inf', 'me', 90)}<h2>Le front a cédé : ${S.lvl.name}</h2>
      <p>Vous aviez atteint l’étape ${C.node.layer + 1} sur 9.</p>
      <button class="btn" data-act="new">Nouvelle campagne</button></div>`;
  }, 1000);
}

// ---- Récompenses ----
function toReward() {
  C.hq = Math.min(C.hqMax, S.hq.me + 12);
  const n = C.node;
  if (n.type === 'boss' && n.layer === 8) return victory();
  const lo = lootFor(S, C, n.type); C.loot += lo.total; C.phase = 'reward'; C.shop = null; setTimeout(() => SFX.play('coins'), 250);
  app.innerHTML = `<div class="stack"><div class="hd"><span class="ribbon">Butin de guerre</span><span class="coin num">$${C.loot}</span></div>
    <div class="panel lines">${lo.lines.map(l => `<div class="line"><span>${l[0]}</span><span class="num gold">+$${l[1]}</span></div>`).join('')}
      <div class="line total"><span>Total</span><span class="num gold">+$${lo.total}</span></div></div>
    <p class="small">Dépensez votre butin à l’intendance : jokers, nouvelles cartes et entraînement.</p>
    <button class="btn go" data-act="${n.type === 'boss' ? 'bossjoker' : 'toshop'}">${n.type === 'boss' ? 'Choisir un joker offert' : 'Aller à l’intendance'}</button></div>`;
}
function cardStep(rareOnly) {
  window.__opts = rewardCards(Math.random, rareOnly ? 2 : 1);
  app.innerHTML = `<div class="stack"><div class="hd"><span class="ribbon">Dépôt de ravitaillement</span><span class="num">QG ${C.hq} / ${C.hqMax}</span></div>
    <div class="panel">Choisissez une carte pour renforcer votre paquet. Chaque couleur donne un avantage, et deux cartes du même type de couleurs différentes peuvent fusionner.</div>
    <div class="cardrow">${window.__opts.map((c, i) => cardHTML(c, 'pick', `data-add="${i}"`)).join('')}</div>
    <button class="btn ghost" data-act="skipcard">Ne rien prendre</button></div>`;
}
function jokerStep() {
  const left = JOKERS.filter(o => !C.officers.includes(o.id));
  if (C.officers.length >= MAX_JOKERS || !left.length) { C.loot += 6; toast('Vos 5 emplacements de joker sont pleins : +$6 de butin à la place.'); return afterJoker(); }
  const opts = shuffle(left).slice(0, 3);
  app.innerHTML = `<div class="stack"><div class="hd"><span class="ribbon">Choisissez un joker</span><span class="coin num">$${C.loot}</span></div><div class="panel">Un joker est une carte à effet permanent. Vous pouvez en garder 5 au maximum.</div>
    <div class="officers">${opts.map(o => officerItem(o, 'button', `data-officer="${o.id}"`)).join('')}</div>${jokerBar()}</div>`;
}
const afterJoker = () => (C.phase === 'reward' ? toShop() : finishNode());

// ---- Intendance : on dépense le butin de guerre ----
function toShop() {
  C.phase = 'shop';
  if (!C.shop) C.shop = genShop(C, Math.random, ['elite', 'boss'].includes(C.node.type));
  renderShop();
}
function renderShop() {
  const sh = C.shop, full = C.officers.length >= MAX_JOKERS, rc = 2 + sh.rerolls;
  const jrows = sh.jokers.map((j, i) => {
    const d = JOKERS.find(x => x.id === j.id);
    return `<div class="off-item shopj ${j.sold ? 'sold' : ''}">${officerSVG(j.id, 48)}<span class="tx"><b>${d.name}</b><span class="small muted">${d.desc}</span></span>
      <button class="btn buy" data-buyj="${i}" ${j.sold || full || C.loot < j.price ? 'disabled' : ''}>${j.sold ? 'Vendu' : '$' + j.price}</button></div>`;
  }).join('');
  const crows = sh.cards.map((c, i) => `<div class="shopcard ${c.sold ? 'sold' : ''}">${cardHTML(c.card, 'pick')}<button class="btn buy" data-buyc="${i}" ${c.sold || C.loot < c.price ? 'disabled' : ''}>${c.sold ? 'Vendu' : '$' + c.price}</button></div>`).join('');
  const canTrain = C.deck.some(canUpgrade);
  app.innerHTML = `<div class="stack"><div class="hd"><span class="ribbon">Intendance</span><span class="coin num">$${C.loot}</span></div>
    <div class="eyebrow">Vos jokers (${C.officers.length}/${MAX_JOKERS})</div>${jokerBar()}
    <div class="eyebrow">Jokers en vente</div><div class="officers">${jrows}</div>
    <div class="eyebrow">Cartes en vente</div><div class="cardrow">${crows}</div>
    <div class="eyebrow">Atelier</div>
    <button class="off-item plain" data-act="train" ${canTrain ? '' : 'disabled'}><span class="tx"><b>Entraîner une carte</b><span class="small muted">Améliore une carte de votre paquet (jusqu'au niveau 3) : plus d'hommes ou plus de dégâts. À partir de $${Math.min(...C.deck.filter(canUpgrade).map(upgradeCost), 99)}.</span></span></button>
    <button class="off-item plain" data-act="reform" ${C.deck.length > 8 ? '' : 'disabled'}><span class="tx"><b>Réformer une carte · $${REFORM_COST}</b><span class="small muted">Retire une carte du paquet pour piocher plus souvent les autres.</span></span></button>
    <div class="row" style="justify-content:space-between"><span class="row"><button class="pill" data-act="help">Aide</button><button class="pill" data-act="deck">Paquet (${C.deck.length})</button></span>
      <button class="pill" data-act="reroll" ${C.loot < rc ? 'disabled' : ''}>Relancer $${rc}</button></div>
    <button class="btn go" data-act="leave" style="padding-block:15px">Quitter l'intendance</button></div>`;
}
function toCamp() {
  C.phase = 'camp';
  app.innerHTML = `<div class="stack"><div class="hd"><span class="ribbon">Camp de base</span><span class="num">QG ${C.hq} / ${C.hqMax}</span></div><div class="panel">Un seul choix avant de reprendre la route.</div>
    <button class="off-item plain" data-act="heal"><span class="tx"><b>Soigner le QG</b><span class="small muted">+16 PV (jusqu'au maximum).</span></span></button>
    <button class="off-item plain" data-act="removecard"><span class="tx"><b>Retirer une carte</b><span class="small muted">Un paquet plus petit retombe plus souvent sur vos meilleures cartes.</span></span></button></div>`;
}
function victory() {
  app.innerHTML = `<div class="stack end"><div class="big">Victoire !</div><div class="armies">${['inf', 'spider', 'tank', 'chasseur'].map((k, i) => spriteSVG(k, 'me', 72, ['J', 'V', 'R', 'N'][i])).join('')}</div><h2>Le dernier quartier général est tombé</h2>
    <p>Campagne gagnée avec ${C.deck.length} cartes et ${C.officers.length} jokers.</p>
    <button class="btn" data-act="new">Rejouer</button></div>`;
}

// ---- Fenêtres ----
function closeModal() { document.querySelectorAll('.modal').forEach(m => m.remove()); }
function openModal(html) {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="box">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
}
function helpModal(first) {
  openModal(`<div class="hd"><span class="ribbon">Comment jouer</span><button class="pill" data-act="close">${first ? 'Compris' : 'Fermer'}</button></div>
    <ol>
    <li><b>But :</b> détruire le <b>QG ennemi</b> (en haut) avant que <b>votre QG</b> (en bas) tombe.</li>
    <li>Le front a <b>3 lignes</b>. Sur chaque ligne, votre <b>armée de terre</b> (bleue, en bas) affronte les groupes ennemis rouges (en haut). Si la ligne d'en face est vide, elle frappe directement le QG.</li>
    <li>Chaque carte est un <b>groupe</b> : « 10×1 » veut dire 10 tirs de 1 dégât. Quand le groupe perd des PV, il perd des hommes, donc des tirs. Un blindage arrête les petits tirs.</li>
    <li><b>Marine et armée de l'air</b> se posent dans la bande bleue sous la ligne. Elles tirent de loin, restent quelques tours, et ne peuvent pas être touchées.</li>
    <li><b>Les couleurs</b> : <i class="dot" style="background:#ffd24a"></i> jaune +1 dégât par tir · <i class="dot" style="background:#e5543f"></i> rouge +50 % d'effectif · <i class="dot" style="background:#52b34f"></i> vert +50 % de PV · <i class="dot" style="background:#39404f"></i> noir perce 1 blindage et attaque dès l'arrivée.</li>
    <li><b>Fusion :</b> deux cartes du même type et de couleurs différentes se fusionnent (touchez la première, puis celle qui brille). Le groupe obtenu cumule les deux couleurs et ne coûte qu'une carte. Jaune + rouge = orange, par exemple. Les deux cartes reviennent séparées dans la défausse.</li>
    <li><b>Butin de guerre :</b> après chaque bataille, vous gagnez du butin ($). À l'intendance, achetez des <b>jokers</b> (cartes à effet permanent, 5 au maximum), de nouvelles cartes, ou <b>entraînez</b> une carte (niveau 2 puis 3 : plus d'hommes ou de dégâts).</li>
    <li>Touchez <b>« Fin du tour »</b> : vos groupes attaquent, puis l'ennemi. Un groupe qui vient d'arriver dort (zz) un tour, sauf les noirs.</li>
    <li><b>L'ennemi se montre à l'avance :</b> silhouettes en pointillé pour les renforts, bandeaux rouges pour les obus.</li>
    </ol>
    <p class="small muted">Touchez un groupe sur le terrain pour lire ses capacités. Sur la carte, vous choisissez votre route. Les étapes sans combat vous offrent une carte, un joker ou du repos.</p>`);
}
function deckModal(mode) {
  const groups = new Map();
  C.deck.forEach(c => { if (mode === 'upgrade' && !canUpgrade(c)) return; const k = cardKey(c); if (!groups.has(k)) groups.set(k, { c, n: 0 }); groups.get(k).n++; });
  const list = [...groups.values()].sort((a, b) => FAM_ORDER[TYPES[a.c.t].fam] - FAM_ORDER[TYPES[b.c.t].fam] || a.c.t.localeCompare(b.c.t) || a.c.c.localeCompare(b.c.c) || (a.c.lv || 1) - (b.c.lv || 1));
  const title = mode === 'remove' ? 'Retirer quelle carte ?' : mode === 'upgrade' ? 'Entraîner quelle carte ?' : `Votre paquet (${C.deck.length})`;
  const attr = c => (mode === 'remove' ? `data-remove="${cardKey(c)}"` : mode === 'upgrade' ? `data-train="${cardKey(c)}"` : '');
  const note = c => (mode === 'upgrade' ? `<div class="small" style="text-align:center;margin-top:4px"><b>Niv. ${c.lv || 1} → ${(c.lv || 1) + 1}</b> : ${upText(c.t, (c.lv || 1) + 1)}<br><span class="coin num">$${upgradeCost(c)}</span></div>` : '');
  openModal(`<div class="hd"><span class="ribbon">${title}</span><button class="pill" data-act="close">${mode ? 'Annuler' : 'Fermer'}</button></div>
    <div class="deckgrid">${list.map(g => `<div>${cardHTML(g.c, mode ? 'pick' : '', attr(g.c))}${note(g.c)}<div class="small" style="text-align:center;margin-top:5px">× ${g.n}</div></div>`).join('')}</div>`);
}
function describeUnit(uid) {
  const u = findUnit(S, uid); if (!u) return;
  const men = u.land ? shotsOf(u) : u.menMax;
  const bits = [`${men} tir${men > 1 ? 's' : ''} de ${u.dmg}`];
  if (u.land) bits.push(`${u.hp}/${u.hpMax} PV`); else bits.push(`reste ${u.ttl} tour${u.ttl > 1 ? 's' : ''}`);
  if (u.armor) bits.push(`blindage ${u.armor}`);
  if (u.pierce && u.side === 'me' && !(u.pierce > 5)) bits.push(`perce ${u.pierce}`);
  (u.kw || []).forEach(k => { if (KW_DESC[k]) bits.push(KW_DESC[k]); });
  if (u.fresh) bits.push('vient d’arriver : attaque au prochain tour');
  toast(`${u.name}${u.cols ? ' ' + colorName(u.cols).toLowerCase() : ''} : ${bits.join(', ')}`);
}

// ---- Événements ----
document.addEventListener('click', e => {
  const t = e.target;
  const nd = t.closest('[data-node]'); if (nd && nd.classList.contains('reach')) { SFX.play('stamp'); const [l, i] = nd.dataset.node.split('-').map(Number); return nodeModal(C.map[l][i]); }
  const go = t.closest('[data-go]'); if (go) { SFX.play('go'); const [l, i] = go.dataset.go.split('-').map(Number); return enterNode(C.map[l][i]); }
  const add = t.closest('[data-add]'); if (add) { SFX.play('buy'); C.deck.push({ ...window.__opts[+add.dataset.add] }); return finishNode(); }
  const bj = t.closest('[data-buyj]'); if (bj) { const j = C.shop.jokers[+bj.dataset.buyj]; if (j.sold || C.loot < j.price || C.officers.length >= MAX_JOKERS) return; C.loot -= j.price; C.officers.push(j.id); j.sold = true; if (j.id === 'brandt') { C.hqMax += 20; C.hq = Math.min(C.hqMax, C.hq + 20); } SFX.play('jokerbuy'); toast('Joker acheté.'); return renderShop(); }
  const bc = t.closest('[data-buyc]'); if (bc) { const c = C.shop.cards[+bc.dataset.buyc]; if (c.sold || C.loot < c.price) return; C.loot -= c.price; C.deck.push({ ...c.card }); c.sold = true; SFX.play('buy'); toast('Carte ajoutée au paquet.'); return renderShop(); }
  const tr = t.closest('[data-train]'); if (tr) { const card = C.deck.find(c => cardKey(c) === tr.dataset.train); if (!card || C.loot < upgradeCost(card)) { closeModal(); return toast('Pas assez de butin.'); } C.loot -= upgradeCost(card); card.lv = (card.lv || 1) + 1; closeModal(); SFX.play('levelup'); toast(`${TYPES[card.t].name} passe au niveau ${card.lv}.`); return renderShop(); }
  const jk = t.closest('[data-joker]'); if (jk) return jokerModal(+jk.dataset.joker);
  const sl = t.closest('[data-sell]'); if (sl) { const i = +sl.dataset.sell, j = JOKERS.find(x => x.id === C.officers[i]); C.loot += Math.floor(j.cost / 2); C.officers.splice(i, 1); closeModal(); SFX.play('sell'); toast(`${j.name} vendu.`); return C.phase === 'shop' ? renderShop() : document.querySelector('[data-officer]') ? jokerStep() : toMap(); }
  const rem = t.closest('[data-remove]');
  if (rem) {
    const shop = C.phase === 'shop';
    if (C.deck.length <= 8) { closeModal(); return toast('Gardez au moins 8 cartes.'); }
    if (shop && C.loot < REFORM_COST) { closeModal(); return toast('Pas assez de butin.'); }
    C.deck.splice(C.deck.findIndex(c => cardKey(c) === rem.dataset.remove), 1); closeModal();
    SFX.play('reform');
    if (shop) { C.loot -= REFORM_COST; return renderShop(); }
    return finishNode();
  }
  const off = t.closest('[data-officer]');
  if (off) { SFX.play('jokerbuy'); C.officers.push(off.dataset.officer); if (off.dataset.officer === 'brandt') { C.hqMax += 20; C.hq = Math.min(C.hqMax, C.hq + 20); } return afterJoker(); }
  if (S && document.getElementById('hand')) {
    const card = t.closest('.card[data-hi]'); if (card) return onCard(+card.dataset.hi);
    if (sel !== null && !busy) {
      const u = t.closest('.u.tgt'); if (u) return doPlay(sel, { uid: +u.dataset.uid });
      const lane = t.closest('.lane.tgt'); if (lane) return doPlay(sel, { lane: +lane.dataset.lane });
    }
    const unit = t.closest('.u:not(.ghost)'); if (unit && !busy) return describeUnit(+unit.dataset.uid);
  }
  const b = t.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a !== 'end') SFX.play('tap');
  if (a === 'new') newCampaign();
  else if (a === 'help') helpModal(false);
  else if (a === 'close') closeModal();
  else if (a === 'end') doEnd();
  else if (a === 'split') { if (sel !== null && splitCard(S, sel)) { sel = null; SFX.play('split'); renderBattle(); } }
  else if (a === 'deck') deckModal(false);
  else if (a === 'skipcard') finishNode();
  else if (a === 'heal') { C.hq = Math.min(C.hqMax, C.hq + 16); finishNode(); }
  else if (a === 'removecard') deckModal('remove');
  else if (a === 'toshop') toShop();
  else if (a === 'bossjoker') jokerStep();
  else if (a === 'train') deckModal('upgrade');
  else if (a === 'reform') deckModal('remove');
  else if (a === 'leave') finishNode();
  else if (a === 'reroll') { const rc = 2 + C.shop.rerolls; if (C.loot < rc) return; C.loot -= rc; SFX.play('reroll'); const n = C.shop.rerolls + 1; C.shop = genShop(C, Math.random, ['elite', 'boss'].includes(C.node.type)); C.shop.rerolls = n; renderShop(); }
});
document.addEventListener('click', e => { if (busy && !e.target.closest('[data-act]')) fast = true; });

function renderSoundButton() {
  let b = document.getElementById('snd');
  if (!b) {
    const bar = document.createElement('div'); bar.className = 'topbar';
    bar.innerHTML = '<button class="pill" id="snd" aria-pressed="true"></button>';
    document.body.insertBefore(bar, document.getElementById('app')); b = document.getElementById('snd');
    b.addEventListener('click', () => { SFX.setMuted(!SFX.isMuted()); renderSoundButton(); if (!SFX.isMuted()) SFX.play('tap'); });
  }
  b.textContent = SFX.isMuted() ? 'Son : coupé' : 'Son : activé';
  b.setAttribute('aria-pressed', String(!SFX.isMuted()));
}
function showTitle() {
  renderSoundButton();
  const rec = load();
  const army = (side, keys) => keys.map(k => spriteSVG(k[0], side, 60, k[1])).join('');
  app.innerHTML = `<div class="title"><h1>Ligne de Front</h1>
    <div class="tag">1944. Terre, mer et air : fusionnez vos cartes de couleur pour créer des unités plus puissantes et brisez le front ennemi.</div>
    <div class="armies">${army('me', [['inf', 'J'], ['spider', 'V'], ['tank', 'R'], ['chasseur', 'N']])}${army('en', [['panzer', ''], ['gren', ''], ['rifle', '']])}</div>
    <div class="row" style="justify-content:center"><button class="btn go" data-act="new">Nouvelle campagne</button><button class="btn ghost" data-act="help">Comment jouer</button></div>
    <div class="record">${rec.level ? `Meilleure progression : étape ${Math.min(9, rec.level)} sur 9` : 'Aucune campagne jouée pour le moment.'}</div></div>`;
}
showTitle();
</script>
</body>
</html>
