name: Publish PWA (GitHub Pages)

# Lancement manuel uniquement : Actions > « Publish PWA » > Run workflow.
# Prérequis (une seule fois) : Settings > Pages > Source = « GitHub Actions ».
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check build directory
        run: test -f build/index.html && test -f build/manifest.webmanifest && test -f build/sw.js

      # Le service worker reçoit la version du jeu, l'empreinte des images/musiques et la liste hors ligne.
      - name: Stamp service worker
        run: python3 tools/stamp_sw.py build "$GITHUB_SHA"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
