<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahjong Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap&text=%E4%B8%AD%E7%99%BC%E7%99%BD%E8%90%AC%E7%AB%B9%E7%AD%92%E7%87%88%E7%AD%86%E7%8F%A0%E6%89%87%E7%8E%89%E5%A2%A8%E7%AE%97%E6%9F%B1%E9%B6%B4%E8%B2%93%E9%BE%9C%E8%A2%8B%E9%9B%99%E7%A0%82%E7%B5%82%E9%9A%B1%E9%AA%B0%E9%99%B0%E9%99%BD%E8%93%AE%E5%8D%B0%E9%BA%BB%E9%9B%80%E7%89%8C%E8%B2%A0%E5%8B%9D">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one centred column, a felt table. Hand of ivory tiles at the bottom, relics as red seals on top. */
:root {
  --felt: #0d2b23;
  --felt-2: #123629;
  --felt-3: #1a4636;
  --ink: #ece4cd;
  --muted: #8fa89a;
  --ivory: #f4ecd3;
  --ivory-2: #e3d7b4;
  --tile-edge: #2f7d62;
  --tile-edge-dark: #1b4d3b;
  --bamboo: #1d7a4b;
  --circle: #25579e;
  --char: #b5302a;
  --chips: #3b7fd1;
  --mult: #d1493a;
  --gold: #e0b341;
  --seal: #b8322a;
  --line: rgba(236, 228, 205, .14);
  --font-display: "Noto Serif TC", "Songti TC", "Noto Serif CJK TC", "Hiragino Mincho ProN", serif;
  --font-body: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--felt);
  background-image: radial-gradient(ellipse at 50% 0%, var(--felt-3), var(--felt) 70%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 14px 40px;
  min-height: 100%;
}
#app { max-width: 760px; margin-inline: auto; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 1.15rem; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

/* Buttons */
.btn {
  border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; letter-spacing: .01em;
  background: var(--gold); color: #2a1f05; box-shadow: 0 3px 0 #8d6b17;
  transition: transform .08s, box-shadow .08s, filter .15s;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #8d6b17; }
.btn.play { background: var(--chips); color: #fff; box-shadow: 0 3px 0 #1d4d8a; }
.btn.play:active:not(:disabled) { box-shadow: 0 1px 0 #1d4d8a; }
.btn.disc { background: var(--mult); color: #fff; box-shadow: 0 3px 0 #8a2a20; }
.btn.disc:active:not(:disabled) { box-shadow: 0 1px 0 #8a2a20; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn:disabled { filter: grayscale(.8) brightness(.6); cursor: not-allowed; }

/* Title */
.title { display: grid; gap: 18px; justify-items: start; padding-block: 8vh 4vh; }
.title .mark {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(5rem, 24vw, 9rem); line-height: .95;
  color: var(--seal); text-shadow: 0 0 0 #000; letter-spacing: .02em;
}
.title h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 800; letter-spacing: -.01em; }
.title p { max-width: 52ch; color: var(--muted); }
.title .row { display: flex; gap: 10px; flex-wrap: wrap; }
.record { font-family: var(--font-num); font-size: .85rem; color: var(--muted); }

/* Panels */
.panel { background: rgba(0, 0, 0, .22); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.stack { display: grid; gap: 12px; }
.hd { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }

/* Blind select */
.blinds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.blind { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 4px; background: rgba(0,0,0,.2); align-content: start; }
.blind.cur { border-color: var(--gold); background: rgba(224,179,65,.09); }
.blind.done { opacity: .5; }
.blind .nm { font-weight: 800; }
.blind .tg { font-family: var(--font-num); font-size: 1.15rem; color: var(--gold); }
.blind .tag { font-size: .75rem; color: var(--muted); }
.boss-note { color: #ff9a8c; font-size: .85rem; }
@media (max-width: 520px) { .blinds { grid-template-columns: 1fr; } }

/* Round */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: stretch; }
.target { display: grid; gap: 6px; }
.target .big { font-family: var(--font-num); font-size: clamp(1.8rem, 7vw, 2.4rem); font-weight: 600; line-height: 1; }
.bar { height: 8px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #f3d783); transition: width .35s; }
.stats { display: grid; grid-template-columns: repeat(2, auto); gap: 6px 14px; align-content: center; }
.stat { display: grid; justify-items: start; }
.stat b { font-family: var(--font-num); font-size: 1.25rem; font-weight: 600; }
.stat span { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.stat.money b { color: var(--gold); }

.relics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.relic, .slot { aspect-ratio: 1; border-radius: 10px; position: relative; }
.slot { border: 1.5px dashed var(--line); }
.relic {
  border: 0; background: var(--seal); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), 0 3px 0 #6a1d18;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: var(--ivory); font-size: clamp(1.4rem, 6vw, 2.2rem);
  transition: transform .12s;
}
.relic.sel { outline: 2px solid var(--gold); outline-offset: 2px; }
.relic.fire { animation: fire .35s; }
@keyframes fire { 40% { transform: scale(1.18) rotate(-4deg); } }
.relicinfo { min-height: 3.2em; font-size: .9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.relicinfo .tx { flex: 1 1 14em; min-width: 0; }

.calc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.calc .hn { font-weight: 800; font-size: 1.1rem; text-wrap: balance; }
.calc .hn small { display: block; font-weight: 500; font-size: .75rem; color: var(--muted); }
.calc .eq { display: flex; align-items: center; gap: 6px; font-family: var(--font-num); font-weight: 600; font-size: 1.25rem; }
.calc .eq span.v { min-width: 3.6ch; text-align: center; padding: 6px 8px; border-radius: 8px; color: #fff; }
.calc .c { background: var(--chips); }
.calc .m { background: var(--mult); }
.calc .bump { animation: bump .22s; }
@keyframes bump { 40% { transform: scale(1.2); } }

/* Tiles */
.handwrap { container-type: inline-size; }
.hand { --tw: min(calc((100cqw - 64px) / 7), 66px); display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 8px; padding-block: 18px 8px; }
.g { display: flex; gap: 3px; padding: 5px 5px 8px; border-radius: 12px; }
.g.meld { background: rgba(70, 170, 120, .16); box-shadow: inset 0 0 0 1.5px rgba(90, 200, 140, .4); }
.g.pair { background: rgba(224, 179, 65, .14); box-shadow: inset 0 0 0 1.5px rgba(224, 179, 65, .5); }
.g.left { flex-wrap: wrap; justify-content: center; max-width: 100%; }
.hand .tile { width: var(--tw); flex: none; }
.tile.D3 .jk { position: absolute; right: 9%; bottom: 7%; font-size: 17cqw; line-height: 1; color: var(--circle); }
.tile.inline { width: 30px; display: inline-grid; vertical-align: middle; margin-inline: 2px; }
.wall { text-align: center; }
.fans { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.fans:empty { display: none; }
.fanpill { font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: rgba(224, 179, 65, .18); color: var(--gold); }
.proj { grid-column: 1 / -1; }
.hn.win { color: var(--gold); }
.btn.glow { animation: glow 1.1s infinite alternate; }
@keyframes glow { to { box-shadow: 0 3px 0 #1d4d8a, 0 0 18px 3px rgba(224, 179, 65, .7); } }
.tile {
  container-type: inline-size; position: relative; aspect-ratio: 3 / 4.1; border: 0; padding: 0; min-width: 0;
  border-radius: 14% / 10%; background: linear-gradient(180deg, var(--ivory), var(--ivory-2));
  box-shadow: 0 5px 0 var(--tile-edge), 0 6px 0 var(--tile-edge-dark), 0 10px 12px rgba(0,0,0,.45);
  display: grid; justify-items: center; align-content: center; gap: 2cqw; color: var(--ink);
  transition: transform .12s;
}
.tile .tn { font-family: var(--font-num); font-weight: 600; font-size: 54cqw; line-height: 1; }
.tile .ts { font-family: var(--font-display); font-weight: 700; font-size: 36cqw; line-height: 1; }
.tile.B { color: var(--bamboo); }
.tile.C { color: var(--circle); }
.tile.K { color: var(--char); }
.tile.D .dg { font-family: var(--font-display); font-weight: 700; font-size: 74cqw; line-height: 1; }
.tile.D1 { color: var(--char); }
.tile.D2 { color: var(--bamboo); }
.tile.D3 { color: var(--circle); }
.tile.D3 .dg { font-size: 0; width: 56cqw; height: 66cqw; border: 5cqw solid var(--circle); border-radius: 6cqw; }
.tile.sel { transform: translateY(-12%); box-shadow: 0 5px 0 var(--gold), 0 6px 0 #8d6b17, 0 14px 14px rgba(0,0,0,.5); }
.tile.dead { filter: grayscale(1) brightness(.7); }
.tile.score { animation: tilepulse .35s; }
@keyframes tilepulse { 40% { transform: translateY(-22%) scale(1.08); } }
.tile .eng { position: absolute; top: 5%; right: 7%; width: 16cqw; height: 16cqw; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(0,0,0,.35); }
.tile .eng.chips { background: var(--chips); }
.tile .eng.mult { background: var(--mult); }
.tile .eng.gold { background: var(--gold); }
.tile.mini { box-shadow: 0 2px 0 var(--tile-edge), 0 3px 0 var(--tile-edge-dark); }
.tile.dim { opacity: .28; }
.pop {
  position: absolute; left: 50%; top: -10%; transform: translateX(-50%); font-family: var(--font-num); font-weight: 700; font-size: 1rem;
  padding: 2px 8px; border-radius: 8px; color: #fff; pointer-events: none; z-index: 5; white-space: nowrap; animation: pop .9s forwards;
}
.pop.c { background: var(--chips); } .pop.m { background: var(--mult); } .pop.x { background: #8e44ad; } .pop.g { background: var(--gold); color: #2a1f05; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, 10px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -34px); } }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions .btn { padding-block: 14px; font-size: 1rem; }
.subactions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.pill { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 6px 12px; font-size: .85rem; }

/* Shop */
.offers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .offers { grid-template-columns: 1fr; } }
.offer { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: rgba(0,0,0,.2); }
.offer .relic { width: 56px; font-size: 1.8rem; }
.offer .item { width: 56px; aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; background: var(--felt-3); box-shadow: inset 0 0 0 1.5px var(--line); color: var(--gold); }
.offer h3 { font-size: 1rem; }
.offer p { font-size: .85rem; color: var(--muted); }
.offer .buy { margin-top: 8px; padding: 8px 14px; font-size: .9rem; }
.offer.sold { opacity: .35; }
.lines { display: grid; gap: 6px; }
.line { display: flex; justify-content: space-between; gap: 12px; }
.line.total { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 800; font-size: 1.1rem; }
.gold { color: var(--gold); }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.7); display: grid; place-items: center; padding: 16px; }
.modal .box {
  background: var(--felt-2); border: 1px solid var(--line); border-radius: 16px; padding: 16px; width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; display: grid; gap: 12px;
}
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
td.n { font-family: var(--font-num); white-space: nowrap; }
.decks { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 5px; padding-bottom: 6px; }
.decks .tile { cursor: pointer; }
@media (max-width: 520px) { .decks { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #000; color: var(--ink); border: 1px solid var(--line); padding: 10px 16px; border-radius: 99px; z-index: 80; max-width: calc(100% - 32px); }
.end { text-align: left; }
.end .mark { font-family: var(--font-display); font-weight: 700; font-size: 5rem; line-height: 1; color: var(--seal); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<body>
<div id="app"></div>

<script>
// ==CORE==
const SUIT_NAME = { B: 'Bambous', C: 'Cercles', K: 'Caractères', D: 'Dragons' };
const SUIT_GLYPH = { B: '竹', C: '筒', K: '萬' };
const DRAGON_GLYPH = { 1: '中', 2: '發', 3: '白' };
const DRAGON_NAME = { 1: 'Dragon rouge', 2: 'Dragon vert', 3: 'Dragon blanc' };

function makeDeck() {
  const d = []; let id = 0;
  for (const s of ['B', 'C', 'K']) for (let v = 1; v <= 9; v++) for (let c = 0; c < 4; c++) d.push({ id: id++, suit: s, v, eng: null });
  for (let v = 1; v <= 3; v++) for (let c = 0; c < 4; c++) d.push({ id: id++, suit: 'D', v, eng: null });
  return d;
}
function shuffle(a, rng = Math.random) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const chipVal = t => (t.suit === 'D' ? 10 : t.v);
const tileName = t => (t.suit === 'D' ? DRAGON_NAME[t.v] : t.v + ' de ' + SUIT_NAME[t.suit]);
const keyOf = t => (t.suit === 'D' ? 26 + t.v : { B: 0, C: 9, K: 18 }[t.suit] + t.v - 1);

// Le Dragon blanc est un joker : il remplace n'importe quelle tuile d'un groupe ou de la paire.
const isWild = t => t.suit === 'D' && t.v === 3;

// Cherche la meilleure découpe d'une main en groupes (séquence de 3 ou brelan) + une paire, jokers compris.
// Renvoie les indices des tuiles : melds (avec keys), pair, left. mahjong = au moins 4 groupes et une paire.
function analyze(tiles, isLocked) {
  const lists = Array.from({ length: 29 }, () => []), wilds = [], dead = [];
  tiles.forEach((t, i) => {
    if (isLocked && isLocked(t)) dead.push(i);
    else if (isWild(t)) wilds.push(i);
    else lists[keyOf(t)].push(i);
  });
  const cnt = lists.map(l => l.length), memo = new Map();
  const val = k => (k >= 27 ? 10 : (k % 9) + 1);
  function dfs(p, pu, w) {
    while (p < 29 && cnt[p] === 0) p++;
    if (p >= 29) {
      const mk = Math.floor(w / 3);
      if (!pu && w >= 2) { const k = Math.floor((w - 2) / 3), v = 50 + 100 * k; if (v >= 100 * mk) return { v, m: Array(k).fill(['W']), pair: 'W' }; }
      return { v: 100 * mk, m: Array(mk).fill(['W']), pair: null };
    }
    const mkey = p + '|' + cnt.join('') + (pu ? 1 : 0) + w;
    if (memo.has(mkey)) return memo.get(mkey);
    let best = null;
    const take = (r, add, m, pair) => {
      const v = r.v + add;
      if (!best || v > best.v) best = { v, m: m ? [m, ...r.m] : r.m, pair: pair !== undefined ? pair : r.pair };
    };
    cnt[p]--; take(dfs(p, pu, w), 0); cnt[p]++;
    { const real = Math.min(3, cnt[p]), need = 3 - real;
      if (need <= w) { cnt[p] -= real; take(dfs(p, pu, w - need), 100 + val(p) * 0.003 - need * 0.01, [p, 'pung', [p, p, p]]); cnt[p] += real; } }
    if (p < 27) for (const s of [p - 2, p - 1, p]) {
      if (s < 0 || s % 9 > 6 || Math.floor(s / 9) !== Math.floor(p / 9)) continue;
      const ks = [s, s + 1, s + 2], need = ks.filter(k => cnt[k] === 0).length;
      if (need > w) continue;
      const used = ks.filter(k => cnt[k] > 0); used.forEach(k => cnt[k]--);
      take(dfs(p, pu, w - need), 100 + (val(s) * 3 + 3) * 0.001 - need * 0.01, [s, 'chow', ks]);
      used.forEach(k => cnt[k]++);
    }
    if (!pu) { const real = Math.min(2, cnt[p]), need = 2 - real;
      if (need <= w) { cnt[p] -= real; take(dfs(p, true, w - need), 50 + val(p) * 0.002 - need * 0.01, null, p); cnt[p] += real; } }
    memo.set(mkey, best); return best;
  }
  const r = dfs(0, false, wilds.length), pool = lists.map(l => l.slice()), wp = wilds.slice();
  const grab = k => (k !== undefined && pool[k] && pool[k].length ? pool[k].pop() : wp.pop());
  const melds = r.m.map(([k, kind, keys]) => (k === 'W'
    ? { kind: 'pung', idx: [wp.pop(), wp.pop(), wp.pop()], keys: null }
    : { kind, idx: keys.map(grab), keys }));
  const pair = r.pair === null ? null : r.pair === 'W' ? [wp.pop(), wp.pop()] : [grab(r.pair), grab(r.pair)];
  const pairKey = r.pair === null || r.pair === 'W' ? null : r.pair;
  const left = dead.concat(wp, ...pool).sort((a, b) => keyOf(tiles[a]) - keyOf(tiles[b]));
  return { melds, pair, pairKey, left, mahjong: melds.length >= 4 && !!pair };
}

const MELD_BASE = { chow: { c: 8, dc: 8 }, pung: { c: 16, dc: 12 }, pair: { c: 4, dc: 4 } };
const STUDIES = {
  chow: { name: 'Séquences', icon: '順', note: '+8 jetons par séquence et par niveau' },
  pung: { name: 'Brelans', icon: '刻', note: '+12 jetons par brelan et par niveau' },
  pair: { name: 'Paire', icon: '對', note: '+4 jetons pour la paire et par niveau' },
  mahjong: { name: 'Mahjong', icon: '和', note: '+25 jetons et +1 mult de base au Mahjong, par niveau' },
};

// Combinaisons bonus d'un Mahjong : [nom, mult]. Les jokers (keys absentes) ne bloquent aucune condition.
function fansOf(tiles, A) {
  const fans = [], chows = A.melds.filter(m => m.kind === 'chow' && m.keys), pungs = A.melds.filter(m => m.kind === 'pung');
  const allKeys = A.melds.flatMap(m => m.keys || []).concat(A.pairKey === null ? [] : [A.pairKey]);
  if (A.melds.filter(m => m.kind === 'chow').length === 4) fans.push(['Quatre séquences', 3]);
  if (pungs.length === 4) fans.push(['Quatre brelans', 5]);
  const suits = new Set(allKeys.filter(k => k < 27).map(k => Math.floor(k / 9)));
  const hasHonor = allKeys.some(k => k >= 27);
  if (suits.size <= 1 && !(suits.size === 0 && !hasHonor)) fans.push(hasHonor ? ['Famille et dragons', 4] : ['Une seule famille', 8]);
  for (const m of pungs) if (m.keys && m.keys[0] >= 27) fans.push([DRAGON_NAME[m.keys[0] - 26], 2]);
  if (A.pairKey !== null && A.pairKey >= 27) fans.push(['Paire de dragons', 1]);
  const starts = chows.map(m => m.keys[0]);
  if (starts.some((k, i) => starts.indexOf(k) !== i)) fans.push(['Séquences jumelles', 2]);
  for (const s of [0, 9, 18]) if ([0, 3, 6].every(o => starts.includes(s + o))) fans.push(['Grande séquence', 5]);
  return fans;
}

// Calcule le score d'une main posée. events = étapes rejouées telles quelles par l'animation.
function scoreHand(tiles, ctx) {
  const A = analyze(tiles, ctx.locked), lv = k => (ctx.levels && ctx.levels[k]) || 1;
  const rng = ctx.rng || Math.random, relics = (ctx.relics || []).map(id => RELIC_BY_ID[id]);
  const mj = A.mahjong;
  const base = { chips: mj ? 40 + 25 * (lv('mahjong') - 1) : 10, mult: mj ? 3 + (lv('mahjong') - 1) : 1 };
  let chips = base.chips, mult = base.mult, money = 0;
  const events = [];
  const push = e => {
    events.push(e);
    if (e.chips) chips += e.chips; if (e.mult) mult += e.mult; if (e.xmult) mult *= e.xmult; if (e.money) money += e.money;
  };
  const groups = A.melds.map(m => ({ kind: m.kind, idx: m.idx })).concat(A.pair ? [{ kind: 'pair', idx: A.pair }] : []);
  const c = { mahjong: mj, melds: A.melds.length, isFirst: !!ctx.isFirst, isLast: !!ctx.isLast, rng };
  groups.forEach((g, gi) => {
    for (const i of g.idx) {
      const t = tiles[i];
      if (ctx.debuffSuit && t.suit === ctx.debuffSuit) { push({ tile: i, group: gi, dead: true }); continue; }
      push({ tile: i, group: gi, chips: chipVal(t) });
      if (t.eng === 'chips') push({ tile: i, chips: 30 });
      if (t.eng === 'mult') push({ tile: i, mult: 4 });
      if (t.eng === 'gold') push({ tile: i, money: 2 });
      relics.forEach((r, ri) => { if (r.tile) { const e = r.tile(t, c); if (e) push({ tile: i, relic: ri, ...e }); } });
    }
    const mb = MELD_BASE[g.kind];
    push({ group: gi, chips: mb.c + (lv(g.kind) - 1) * mb.dc, mult: g.kind === 'pair' ? 0 : 1 });
    relics.forEach((r, ri) => { if (r.group) { const e = r.group(g, c); if (e) push({ group: gi, relic: ri, ...e }); } });
  });
  if (mj) for (const [name, m] of fansOf(tiles, A)) push({ fan: name, mult: m });
  relics.forEach((r, ri) => { if (r.hand) { const e = r.hand(c); if (e) push({ relic: ri, ...e }); } });
  return { analysis: A, groups, mahjong: mj, base, events, chips, mult, total: Math.floor(chips * mult), money };
}

function updateStats() {
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('st-h', R.hands); set('st-d', R.swaps); set('st-m', '$' + G.money); set('st-w', R.draw.length);
  const s = $('#score'); if (s) s.innerHTML = `${fmt(R.score)} <span class="muted small">/ ${fmt(R.target)}</span>`;
  const b = $('#bar'); if (b) b.style.width = Math.min(100, (R.score / R.target) * 100) + '%';
}
function renderHand() {
  const el = $('#hand'); if (!el) return;
  const A = R.an = analyze(R.hand, isLocked);
  const cell = i => { const t = R.hand[i]; return tileHTML(t, (R.sel.includes(t.id) ? 'sel ' : '') + (isLocked(t) ? 'dead' : '')); };
  let h = A.melds.map((m, gi) => `<div class="g meld" data-g="${gi}">${m.idx.map(cell).join('')}</div>`).join('');
  if (A.pair) h += `<div class="g pair" data-g="${A.melds.length}">${A.pair.map(cell).join('')}</div>`;
  if (A.left.length) h += `<div class="g left">${A.left.map(cell).join('')}</div>`;
  el.innerHTML = h;
  const none = R.busy || !R.sel.length;
  $('#bswap').disabled = none || R.swaps <= 0;
  $('#bswap').textContent = R.sel.length ? `Échanger (${R.sel.length})` : 'Échanger';
  const pose = $('#bpose'); pose.disabled = R.busy; pose.textContent = A.mahjong ? 'Mahjong !' : 'Poser la main'; pose.classList.toggle('glow', A.mahjong);
  const w = $('#wall'); if (w) w.innerHTML = 'Prochaines tuiles du mur : ' + R.draw.slice(-3).reverse().map(t => tileHTML(t, 'mini inline')).join('');
  updatePreview(); updateStats();
}
function statusOf(A) {
  const n = A.melds.length;
  if (A.mahjong) return ['Mahjong !', plural(n, 'groupe') + ' et une paire'];
  const need = Math.max(0, 4 - n);
  const miss = need ? `Il manque ${plural(need, 'groupe')}${A.pair ? '' : ' et une paire'}` : 'Il manque une paire';
  return [`${plural(n, 'groupe')} ${A.pair ? 'et une paire' : 'sans paire'}`, miss];
}
function updatePreview() {
  const hn = $('#hn'); if (!hn) return;
  const res = scoreHand(R.hand, ctxFor(true)), [t1, t2] = statusOf(res.analysis);
  hn.innerHTML = `${t1}<small>${t2}</small>`;
  hn.classList.toggle('win', res.mahjong);
  $('#cc').textContent = fmtM(res.chips); $('#cm').textContent = fmtM(res.mult);
  $('#fans').innerHTML = res.events.filter(e => e.fan).map(e => `<span class="fanpill">${e.fan} +${e.mult}</span>`).join('');
  $('#proj').textContent = `≈ ${fmt(res.total)} points si vous posez maintenant`;
}
function toggleTile(id) {
  if (R.busy) return;
  const t = R.hand.find(x => x.id === id); if (!t) return;
  const i = R.sel.indexOf(id);
  if (i >= 0) R.sel.splice(i, 1);
  else if (R.sel.length < R.maxSwap) R.sel.push(id);
  else { toast(`Un échange remplace ${R.maxSwap} tuiles au plus.`); return; }
  renderHand();
}
function selectUseless() {
  if (R.busy) return;
  R.sel = R.an.left.slice(0, R.maxSwap).map(i => R.hand[i].id);
  if (!R.sel.length) toast('Aucune tuile inutile : toutes servent dans un groupe ou la paire.');
  renderHand();
}
function doSwap() {
  if (R.busy || !R.sel.length || R.swaps <= 0) return;
  const n = R.sel.length;
  R.hand = R.hand.filter(t => !R.sel.includes(t.id)); R.sel = [];
  R.hand.push(...R.draw.splice(-n)); R.swaps--;
  renderHand();
  if (R.an.mahjong) toast('Mahjong ! Posez la main pour marquer.');
}

function popAt(el, text, cls) {
  if (!el) return;
  const p = document.createElement('span'); p.className = 'pop ' + cls; p.textContent = text; el.appendChild(p);
  setTimeout(() => p.remove(), 950);
}
const retrig = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
async function doPose() {
  if (R.busy) return;
  R.busy = true; R.sel = []; renderHand();
  const hand = R.hand, res = scoreHand(hand, ctxFor(false));
  const wait = ms => sleep(fast ? 25 : ms);
  const cc = $('#cc'), cm = $('#cm'), hn = $('#hn');
  hn.innerHTML = `${res.mahjong ? 'Mahjong !' : 'Main posée'}<small>${plural(res.groups.length, 'groupe')}</small>`;
  $('#fans').innerHTML = ''; $('#proj').textContent = '';
  let chips = res.base.chips, mult = res.base.mult;
  cc.textContent = fmtM(chips); cm.textContent = fmtM(mult);
  await wait(450);
  for (const e of res.events) {
    const tEl = e.tile !== undefined ? document.querySelector(`#hand .tile[data-id="${hand[e.tile].id}"]`) : null;
    const gEl = e.group !== undefined && e.tile === undefined ? document.querySelector(`#hand .g[data-g="${e.group}"]`) : null;
    const rEl = e.relic !== undefined ? document.querySelector(`.relics [data-relic="${e.relic}"]`) : null;
    retrig(tEl, 'score'); retrig(rEl, 'fire');
    const host = e.relic !== undefined && !tEl ? rEl : tEl || gEl;
    if (e.dead) { if (tEl) tEl.classList.add('dead'); popAt(tEl, '0', 'c'); await wait(90); continue; }
    if (e.fan) { hn.innerHTML = `${e.fan}<small>Combinaison bonus</small>`; popAt(cm.parentElement, '+' + e.mult, 'm'); }
    if (e.chips) { chips += e.chips; popAt(host, '+' + e.chips, 'c'); cc.textContent = fmtM(chips); retrig(cc, 'bump'); }
    if (e.mult) { mult += e.mult; if (!e.fan) popAt(e.chips && rEl ? rEl : host, '+' + e.mult + ' mult', 'm'); cm.textContent = fmtM(mult); retrig(cm, 'bump'); }
    if (e.xmult) { mult *= e.xmult; popAt(host, '×' + fmtM(e.xmult), 'x'); cm.textContent = fmtM(mult); retrig(cm, 'bump'); }
    if (e.money) popAt(host, '+$' + e.money, 'g');
    await wait(e.fan ? 420 : e.relic !== undefined ? 480 : e.tile !== undefined ? 110 : 260);
  }
  await wait(400);
  const total = res.total, start = R.score, steps = fast ? 4 : 18;
  for (let i = 1; i <= steps; i++) { R.score = Math.round(start + (total * i) / steps); updateStats(); await sleep(fast ? 10 : 24); }
  R.score = start + total; G.best = Math.max(G.best, total);
  G.money += res.money;
  if (R.blind.boss && R.blind.boss.id === 'usurer') G.money = Math.max(0, G.money - 1);
  R.hands--; R.played++;
  updateStats();
  await wait(300);
  if (R.score >= R.target) return winRound();
  if (R.hands <= 0) return loseRun();
  deal(); R.busy = false; fast = false; renderRound(); toast('Nouvelle main : ' + plural(R.hands, 'main') + ' restante' + (R.hands > 1 ? 's' : ''));
}

// ---- Fin de manche ----
function winRound() {
  const b = R.blind, lines = [[`Blinde vaincue : ${b.name}`, b.reward]];
  if (R.hands > 0) lines.push([`Mains restantes (${R.hands})`, R.hands]);
  const interest = Math.min(5, Math.floor(G.money / 5));
  if (interest) lines.push([`Intérêts ($1 par $5)`, interest]);
  const pm = passive(G.relics, 'endMoney'); if (pm) lines.push(['Bourse brodée', pm]);
  const total = lines.reduce((s, l) => s + l[1], 0);
  G.money += total;
  const final = G.ante === 8 && G.blind === 2;
  const rec = load(); rec.ante = Math.max(rec.ante || 0, G.ante + (final ? 1 : 0)); rec.hand = Math.max(rec.hand || 0, G.best); if (final) rec.wins = (rec.wins || 0) + 1; save(rec);
  R.busy = true;
  app.innerHTML = `<div class="stack">
    <div class="hd"><h2>Manche gagnée</h2><span class="num gold">$${G.money}</span></div>
    <div class="panel lines">
      <div class="line"><span>Score</span><span class="num">${fmt(R.score)} / ${fmt(R.target)}</span></div>
      ${lines.map(l => `<div class="line"><span>${l[0]}</span><span class="num gold">+$${l[1]}</span></div>`).join('')}
      <div class="line total"><span>Total</span><span class="num gold">+$${total}</span></div>
    </div>
    ${final ? '<button class="btn" data-act="victory">Continuer</button>' : '<button class="btn" data-act="toshop">Aller à la boutique</button>'}
  </div>`;
}
function loseRun() {
  const rec = load(); rec.ante = Math.max(rec.ante || 0, G.ante); rec.hand = Math.max(rec.hand || 0, G.best); save(rec);
  app.innerHTML = `<div class="stack end">
    <div class="mark">負</div>
    <h2>Défaite à l'ante ${G.ante}</h2>
    <p class="muted">Il manquait ${fmt(R.target - R.score)} points sur « ${R.blind.name} ».</p>
    <div class="panel lines">
      <div class="line"><span>Meilleure main</span><span class="num gold">${fmt(G.best)}</span></div>
      <div class="line"><span>Reliques</span><span>${G.relics.length ? G.relics.map(id => RELIC_BY_ID[id].name).join(', ') : 'aucune'}</span></div>
    </div>
    <button class="btn" data-act="new">Nouvelle partie</button>
  </div>`;
}
function victory() {
  app.innerHTML = `<div class="stack end">
    <div class="mark">勝</div>
    <h2>Victoire : les 8 antes sont à vous</h2>
    <div class="panel lines"><div class="line"><span>Meilleure main</span><span class="num gold">${fmt(G.best)}</span></div>
    <div class="line"><span>Reliques</span><span>${G.relics.map(id => RELIC_BY_ID[id].name).join(', ') || 'aucune'}</span></div></div>
    <button class="btn" data-act="new">Rejouer</button>
  </div>`;
}

// ---- Boutique ----
function genShop() {
  const owned = new Set(G.relics);
  const pool = RELICS.filter(r => !owned.has(r.id));
  const picks = [];
  while (picks.length < 2 && pool.length) {
    const w = pool.map(r => (r.cost >= 8 ? 1 : r.cost >= 6 ? 2 : 3));
    let x = Math.random() * w.reduce((a, b) => a + b, 0), k = 0;
    while (x >= w[k]) { x -= w[k]; k++; }
    picks.push(pool.splice(k, 1)[0]);
  }
  const kinds = shuffle(['engChips', 'engMult', 'engGold', 'purge', 'study', 'study']).filter((v, i, a) => a.indexOf(v) === i).slice(0, 2);
  const keys = Object.keys(STUDIES);
  const items = kinds.map(k => (k === 'study' ? { kind: k, type: keys[Math.floor(Math.random() * keys.length)], cost: 3, sold: false }
    : { kind: k, cost: { engChips: 4, engMult: 5, engGold: 4, purge: 3 }[k], sold: false }));
  return { relics: picks.map(r => ({ id: r.id, sold: false })), items, rerolls: 0 };
}
const ITEM_INFO = {
  engChips: { icon: '墨', name: "Encre d'or", desc: 'Grave une tuile de votre choix : +30 jetons quand elle marque.' },
  engMult: { icon: '朱', name: 'Cinabre', desc: 'Grave une tuile de votre choix : +4 mult quand elle marque.' },
  engGold: { icon: '金', name: 'Feuille d’or', desc: 'Grave une tuile de votre choix : +$2 quand elle marque.' },
  purge: { icon: '空', name: 'Purge', desc: 'Retire une tuile de votre choix du paquet (30 tuiles au minimum).' },
};
function renderShop() {
  const rc = 3 + shop.rerolls;
  const relicOffers = shop.relics.map((o, i) => {
    const r = RELIC_BY_ID[o.id];
    return `<div class="offer ${o.sold ? 'sold' : ''}">${relicHTML(o.id, -1)}
      <div><h3>${r.name}</h3><p>${r.desc}</p>
      <button class="btn buy" data-act="buyrelic" data-i="${i}" ${o.sold || G.money < r.cost ? 'disabled' : ''}>${o.sold ? 'Acheté' : 'Acheter $' + r.cost}</button></div></div>`;
  }).join('');
  const itemOffers = shop.items.map((o, i) => {
    const st = STUDIES[o.type], info = o.kind === 'study' ? { icon: st.icon, name: 'Étude : ' + st.name, desc: `Niveau ${G.levels[o.type] || 1} → ${(G.levels[o.type] || 1) + 1}. ${st.note}.` } : ITEM_INFO[o.kind];
    return `<div class="offer ${o.sold ? 'sold' : ''}"><div class="item">${info.icon}</div>
      <div><h3>${info.name}</h3><p>${info.desc}</p>
      <button class="btn buy" data-act="builtem" data-i="${i}" ${o.sold || G.money < o.cost ? 'disabled' : ''}>${o.sold ? 'Acheté' : 'Acheter $' + o.cost}</button></div></div>`;
  }).join('');
  app.innerHTML = `<div class="stack">
    <div class="hd"><h2>Boutique</h2><span class="num gold">$${G.money}</span></div>
    <div class="eyebrow">Reliques (${G.relics.length}/${MAX_RELICS})</div>
    <div class="offers">${relicOffers}</div>
    <div class="eyebrow">Atelier</div>
    <div class="offers">${itemOffers}</div>
    <div class="panel stack"><div class="eyebrow">Vos reliques</div><div class="relics">${relicSlots()}</div><div class="relicinfo muted" id="rinfo"></div></div>
    <div class="subactions"><span><button class="pill" data-act="help">Aide</button> <button class="pill" data-act="deck">Voir le paquet (${G.deck.length})</button></span>
      <button class="pill" data-act="reroll" ${G.money < rc ? 'disabled' : ''}>Relancer $${rc}</button></div>
    <button class="btn" data-act="nextblind" style="padding-block:16px">Prochaine blinde</button>
  </div>`;
  showRelicInfo();
}

// ---- Fenêtres ----
function closeModal() { document.querySelectorAll('.modal').forEach(m => m.remove()); }
function openModal(html) {
  closeModal();
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="box">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) { closeModal(); pending = null; } });
  document.body.appendChild(m);
}
function helpModal() {
  const lv = k => (G && G.levels[k]) || 1;
  const rows = ['chow', 'pung', 'pair', 'mahjong'].map(k => `<tr><td><b>${STUDIES[k].name}</b></td><td class="n">${lv(k)}</td><td class="muted small">${STUDIES[k].note}</td></tr>`).join('');
  openModal(`<div class="hd"><h2>Aide</h2><button class="pill" data-act="close">Fermer</button></div>
    <div class="stack small">
    <p><b>But.</b> Former une main de 14 tuiles : <b>4 groupes + 1 paire</b>. Un groupe est une <b>séquence</b> (3 valeurs qui se suivent dans une famille, ex. 4-5-6 de Cercles) ou un <b>brelan</b> (3 tuiles identiques). Le jeu range votre main tout seul : groupes en vert, paire en or, tuiles inutiles à droite.</p>
    <p><b>Échanger.</b> Sélectionnez des tuiles (6 au plus) puis échangez-les contre des tuiles du mur. Vos échanges sont partagés entre toutes les mains de la blinde : à vous de décider où les dépenser.</p>
    <p><b>Poser.</b> Vous pouvez poser votre main quand vous voulez. Chaque groupe ajoute +1 mult, chaque tuile des groupes ajoute sa valeur en jetons (Dragons : 10). Un Mahjong complet démarre à 40 jetons × 3 et déclenche les combinaisons bonus.</p>
    <p><b>Dragon blanc ★ :</b> c'est un joker, il remplace n'importe quelle tuile.</p>
    <p><b>Combinaisons bonus (Mahjong).</b> Quatre séquences +3 · Quatre brelans +5 · Une seule famille +8 · Une famille et des dragons +4 · Dragon rouge ou vert en brelan +2 · Paire de dragons +1 · Séquences jumelles +2 · Grande séquence (1-2-3, 4-5-6, 7-8-9) +5.</p>
    </div>
    <div class="tablewrap"><table><tr><th>Étude</th><th>Niv.</th><th>Effet</th></tr>${rows}</table></div>`);
}
function deckModal(mode) {
  const so = { B: 0, C: 1, K: 2, D: 3 };
  const tiles = G.deck.slice().sort((a, b) => so[a.suit] - so[b.suit] || a.v - b.v);
  const inDraw = R && R.draw.length && !mode ? new Set(R.draw.map(t => t.id)) : null;
  const title = mode === 'purge' ? 'Choisissez la tuile à retirer' : mode ? 'Choisissez la tuile à graver' : `Paquet (${G.deck.length} tuiles)`;
  openModal(`<div class="hd"><h2>${title}</h2><button class="pill" data-act="close">${mode ? 'Annuler' : 'Fermer'}</button></div>
    ${inDraw ? '<p class="muted small">Les tuiles grisées sont déjà dans votre main.</p>' : ''}
    <div class="decks">${tiles.map(t => tileHTML(t, 'mini ' + (inDraw && !inDraw.has(t.id) ? 'dim' : ''), mode ? `data-pick="${t.id}"` : '')).join('')}</div>`);
}

// ---- Événements ----
document.addEventListener('click', e => {
  const tileEl = e.target.closest('.tile');
  if (tileEl && tileEl.dataset.pick !== undefined) return pickTile(+tileEl.dataset.pick);
  if (tileEl && tileEl.closest('#hand')) return toggleTile(+tileEl.dataset.id);
  const relicEl = e.target.closest('.relic[data-relic]');
  if (relicEl && +relicEl.dataset.relic >= 0) {
    selRelic = selRelic === +relicEl.dataset.relic ? -1 : +relicEl.dataset.relic;
    document.querySelectorAll('.relics .relic').forEach(r => r.classList.toggle('sel', +r.dataset.relic === selRelic));
    return showRelicInfo();
  }
  if (R && R.busy && !e.target.closest('[data-act]')) { fast = true; return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'new') newRun();
  else if (a === 'rules' || a === 'help') helpModal();
  else if (a === 'start') startRound();
  else if (a === 'pose') { fast = false; doPose(); }
  else if (a === 'swap') doSwap();
  else if (a === 'useless') selectUseless();
  else if (a === 'deck') deckModal();
  else if (a === 'close') { closeModal(); pending = null; }
  else if (a === 'toshop') { shop = genShop(); selRelic = -1; renderShop(); }
  else if (a === 'victory') victory();
  else if (a === 'nextblind') { G.blind++; if (G.blind > 2) { G.blind = 0; G.ante++; } selRelic = -1; R = null; toBlindScreen(); }
  else if (a === 'sell') {
    if (selRelic < 0) return;
    const r = RELIC_BY_ID[G.relics[selRelic]]; G.money += Math.floor(r.cost / 2); G.relics.splice(selRelic, 1); selRelic = -1;
    toast(`${r.name} vendue.`);
    if (R && document.getElementById('hand')) renderRound(); else if (shop && document.querySelector('.offers')) renderShop(); else toBlindScreen();
  }
  else if (a === 'buyrelic') {
    const o = shop.relics[+b.dataset.i], r = RELIC_BY_ID[o.id];
    if (G.relics.length >= MAX_RELICS) return toast('Plus de place : vendez une relique.');
    if (G.money < r.cost) return;
    G.money -= r.cost; G.relics.push(o.id); o.sold = true; renderShop();
  }
  else if (a === 'builtem') {
    const o = shop.items[+b.dataset.i]; if (G.money < o.cost) return;
    if (o.kind === 'study') { G.money -= o.cost; G.levels[o.type] = (G.levels[o.type] || 1) + 1; o.sold = true; toast(`${STUDIES[o.type].name} : niveau ${G.levels[o.type]}`); renderShop(); }
    else { pending = o; deckModal(o.kind === 'purge' ? 'purge' : 'eng'); }
  }
  else if (a === 'reroll') {
    const c = 3 + shop.rerolls; if (G.money < c) return;
    G.money -= c; const n = shop.rerolls + 1; shop = genShop(); shop.rerolls = n; renderShop();
  }
});
function pickTile(id) {
  if (!pending) return;
  const t = G.deck.find(x => x.id === id); if (!t) return;
  const o = pending; pending = null;
  if (o.kind === 'purge' && G.deck.length <= 30) { closeModal(); return toast('Gardez au moins 30 tuiles.'); }
  G.money -= o.cost; o.sold = true;
  if (o.kind === 'purge') { G.deck = G.deck.filter(x => x.id !== id); toast(`${tileName(t)} retirée du paquet.`); }
  else { t.eng = { engChips: 'chips', engMult: 'mult', engGold: 'gold' }[o.kind]; toast(`${tileName(t)} gravée.`); }
  closeModal(); renderShop();
}

function showTitle() {
  const rec = load();
  app.innerHTML = `<div class="title">
    <div class="mark">麻雀</div>
    <h1>Mahjong Poker</h1>
    <p>Construisez une vraie main de mahjong : 14 tuiles, 4 groupes et une paire. Échangez vos tuiles, annoncez Mahjong, et marquez comme au poker : jetons × mult. Collectez des reliques, améliorez vos groupes et franchissez huit antes.</p>
    <div class="row"><button class="btn" data-act="new">Nouvelle partie</button><button class="btn ghost" data-act="help">Règles</button></div>
    <div class="record">${rec.ante ? `Meilleure ante : ${rec.ante} · Meilleure main : ${fmt(rec.hand || 0)}${rec.wins ? ' · Victoires : ' + rec.wins : ''}` : 'Aucune partie jouée pour le moment.'}</div>
  </div>`;
}
showTitle();
</script>
</body>
</html>
