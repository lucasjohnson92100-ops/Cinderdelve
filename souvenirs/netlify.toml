# Site « Souvenirs » : à déployer comme un site Netlify distinct, avec "souvenirs" comme dossier de base.
[build]
  publish = "."
  functions = "functions"

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/api/order"
  to = "/.netlify/functions/order"
  status = 200
