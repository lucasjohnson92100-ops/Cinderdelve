# Hébergement de la version installable (PWA) sur Netlify : publication automatique à chaque mise à jour de la branche principale.
[build]
  command = "python3 tools/stamp_sw.py build"
  publish = "build"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
